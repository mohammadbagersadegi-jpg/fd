<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEON GAUNTLET - an original beat 'em up</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05060c; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #cfe8ee; touch-action: none;
  }
  #wrap { position: relative; width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; max-height: 100vh; }
  canvas#screen {
    position: absolute; inset: 0; width: 100%; height: 100%;
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: #05060c; display: block; outline: none;
  }
  #loading {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #05060c; font-size: 14px; letter-spacing: 0.3em;
  }
  #loading.hidden { display: none; }
  #loading-bar-wrap { width: 220px; height: 4px; background: #14202c; }
  #loading-bar { height: 100%; width: 0%; background: #63f7ff; transition: width 80ms linear; }
  #touch {
    position: absolute; inset: auto 0 0 0; display: none; justify-content: space-between;
    padding: 12px; pointer-events: none;
  }
  #touch .pad, #touch .btns { display: flex; gap: 8px; pointer-events: auto; }
  #touch button {
    width: 52px; height: 52px; border-radius: 10px; border: 1px solid #2b4b5a;
    background: rgba(12, 26, 34, 0.72); color: #9fe9f5; font: 600 13px monospace;
    -webkit-user-select: none; user-select: none;
  }
  #touch button.active { background: rgba(60, 200, 220, 0.35); }
  @media (hover: none) and (pointer: coarse) { #touch { display: flex; } }
  #hint {
    position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%);
    font-size: 11px; color: #44606c; letter-spacing: 0.12em; white-space: nowrap;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="screen" width="480" height="270" tabindex="0" aria-label="Neon Gauntlet game canvas"></canvas>
  <div id="loading">
    <div>LOADING NEON GAUNTLET</div>
    <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
    <div style="font-size:10px;color:#3c5a66;letter-spacing:0.15em">ORIGINAL ASSETS - 84 FRAMES</div>
  </div>
  <div id="touch">
    <div class="pad">
      <button data-action="left">&#9664;</button>
      <button data-action="right">&#9654;</button>
      <button data-action="up">&#9650;</button>
      <button data-action="down">&#9660;</button>
    </div>
    <div class="btns">
      <button data-action="attack">ATK</button>
      <button data-action="jump">JMP</button>
      <button data-action="special">SP</button>
      <button data-action="pause">II</button>
    </div>
  </div>
  <div id="hint">ENTER start &middot; ARROWS move &middot; J attack &middot; K jump &middot; L special &middot; ESC pause &middot; F2 hitboxes</div>
</div>

/* ---- src/core.js ---- */
// NEON GAUNTLET - core helpers
// Virtual resolution 480x270 @ 60 ticks per second.
(function () {
  'use strict';
  const FD = (window.FD = window.FD || {});

  FD.VERSION = '1.0.0';
  FD.VIEW_W = 480;
  FD.VIEW_H = 270;
  FD.TICK_HZ = 60;

  FD.clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  FD.lerp = (a, b, t) => a + (b - a) * t;
  FD.sign = (v) => (v > 0 ? 1 : v < 0 ? -1 : 0);
  FD.approach = (v, target, step) => {
    if (v < target) return Math.min(target, v + step);
    if (v > target) return Math.max(target, v - step);
    return v;
  };
  FD.rectsOverlap = (a, b) =>
    a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  // Deterministic PRNG (mulberry32) so tests and recordings replay exactly.
  FD.makeRng = function (seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  FD.ease = {
    outQuad: (t) => 1 - (1 - t) * (1 - t),
    inQuad: (t) => t * t,
    outCubic: (t) => 1 - Math.pow(1 - t, 3),
    inOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
    outBack: (t) => 1 + 2.2 * Math.pow(t - 1, 3) + 1.2 * Math.pow(t - 1, 2),
  };

  FD.pad = (n, len) => String(Math.max(0, Math.floor(n))).padStart(len, '0');
  FD.fmtTime = (ticks) => {
    const total = Math.max(0, Math.floor(ticks / 60));
    return `${FD.pad(Math.floor(total / 60), 1)}:${FD.pad(total % 60, 2)}`;
  };

  // Registry of sound events fired during a tick; the audio module drains it.
  FD.sfxQueue = [];
  FD.sfx = (name, opts) => FD.sfxQueue.push(Object.assign({ name }, opts || {}));
})();

<script>
/* ---- src/assets.js ---- */
// Asset loading.  In normal HTTP mode images come from game/assets/*.
// An embed (the single-file build in dist/, or a captured film page) injects
// window.FD_EMBED = { assets: {path: dataURI}, data?, font?, cinematic? } so the
// same modules run from a file:// URL with no server and no network.
(function () {
  'use strict';
  const FD = window.FD;

  const CHAR_IDS = ['volt', 'rivet'];

  FD.assets = {
    images: Object.create(null),
    ready: false,
    failures: [],

    embed() {
      return window.FD_EMBED || window.FD_FILM || null;
    },

    isFilm() {
      return !!window.FD_FILM;
    },

    data() {
      const e = this.embed();
      return e && e.data ? e.data : window.FD_DATA;
    },

    font() {
      const e = this.embed();
      return e && e.font ? e.font : window.FD_FONT;
    },

    cinematic() {
      const e = this.embed();
      return e && e.cinematic ? e.cinematic : window.FD_CINEMATIC;
    },

    // Build the full list of image paths from the config (no runtime JSON fetch).
    listImages(data) {
      const paths = new Set();
      for (const charId of CHAR_IDS) {
        const cfg = data.animation.characters[charId === 'rivet_elite' ? 'rivet' : charId];
        if (!cfg) continue;
        for (const [anim, spec] of Object.entries(cfg.animations)) {
          spec.frames.forEach((f, i) => {
            paths.add(`characters/${charId}/frames/${anim}/${anim}_${String(i).padStart(2, '0')}.png`);
          });
        }
      }
      const stage = data.stage;
      for (const layer of ['sky', 'far', 'mid', 'near', 'fg']) paths.add(`stage/layers/${layer}.png`);
      for (const prop of ['crate', 'barrel', 'trash']) {
        paths.add(`stage/props/${prop}_0.png`);
        paths.add(`stage/props/${prop}_1.png`);
      }
      paths.add('stage/props/pickup_health.png');
      paths.add('stage/props/pickup_score.png');
      paths.add('stage/props/light_pool.png');
      paths.add('ui/logo.png');
      paths.add('ui/hud_panel.png');
      paths.add('ui/portrait_frame.png');
      paths.add('ui/scanline.png');
      return Array.from(paths);
    },

    srcFor(relPath) {
      const e = this.embed();
      if (e && e.assets && e.assets[relPath]) return e.assets[relPath];
      return `assets/${relPath}`;
    },

    loadImage(relPath) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve({ path: relPath, img });
        img.onerror = () => resolve({ path: relPath, img: null });
        img.src = this.srcFor(relPath);
      });
    },

    async load(progressCb) {
      const data = this.data();
      const font = this.font();
      if (!data) throw new Error('No config data: include src/generated/data.js');
      if (!font) throw new Error('No font data: include src/generated/font.js');
      this.dataRef = data;
      this.fontRef = font;
      const paths = this.listImages(data);
      let loaded = 0;
      const results = await Promise.all(
        paths.map((p) =>
          this.loadImage(p).then((r) => {
            loaded += 1;
            if (progressCb) progressCb(loaded, paths.length);
            return r;
          })
        )
      );
      for (const r of results) {
        if (r.img) this.images[r.path] = r.img;
        else this.failures.push(r.path);
      }
      this.ready = true;
      if (this.failures.length) {
        console.warn('[assets] missing images:', this.failures);
      }
      return this;
    },

    img(relPath) {
      return this.images[relPath] || null;
    },
  };

  // The bundle is already on the page (data.js or an embed), so expose it
  // synchronously.  FD.boot() creates the Game before assets.load() resolves
  // and createGame() reads FD.cfg.presentation.
  FD.assets.dataRef = FD.assets.data() || null;
  FD.assets.fontRef = FD.assets.font() || null;

  // Convenience accessors used across modules.
  FD.characterCfg = function (charId) {
    const chars = FD.assets.dataRef.animation.characters;
    return chars[charId] || chars[String(charId).replace('_elite', '')];
  };

  const section = (key) => (FD.assets.dataRef ? FD.assets.dataRef[key] : null);
  FD.cfg = {
    get movement() { return section('movement'); },
    get collision() { return section('collision'); },
    get combat() { return section('combat'); },
    get animation() { return section('animation'); },
    get stage() {
      const d = FD.assets.dataRef;
      if (!d) return null;
      if (d.currentStage) return d.currentStage;
      const list = FD.stageList();
      return list[0] || d.stage || null;
    },
    get presentation() { return section('presentation'); },
  };

  // ---- eight-stage campaign -------------------------------------------------
  // config/stages.json holds the whole campaign.  The runtime keeps the active
  // stage in `currentStage` so every module can keep reading FD.cfg.stage.
  FD.stageList = function () {
    const data = FD.assets.dataRef;
    const raw = data && data.stages;
    if (!raw) return data && data.stage ? [data.stage] : [];
    return Array.isArray(raw) ? raw : raw.stages || [];
  };

  FD.setStage = function (index) {
    const list = FD.stageList();
    if (!list.length) return null;
    const i = Math.max(0, Math.min(list.length - 1, index | 0));
    const copy = JSON.parse(JSON.stringify(list[i]));
    FD.assets.dataRef.currentStage = copy;
    return copy;
  };
})();

<script>
/* ---- src/font.js ---- */
// 5x7 bitmap font renderer with cached colour atlases.
(function () {
  'use strict';
  const FD = window.FD;

  const PALETTE = {
    white: '#f2f0e8',
    dim: '#8d93a8',
    cyan: '#63f7ff',
    cyanDim: '#2aa9be',
    pink: '#ff5cc4',
    amber: '#ffbe5c',
    red: '#ff5a52',
    green: '#78ffa8',
    ink: '#0a0d18',
    gold: '#ffd166',
    steel: '#b8c4d0',
  };

  const cache = Object.create(null);

  function buildAtlas(color) {
    const font = FD.assets.fontRef;
    const chars = Object.keys(font.glyphs);
    const cellW = font.width + 1;
    const cellH = font.height + 1;
    const cols = 16;
    const rows = Math.ceil(chars.length / cols);
    const cv = document.createElement('canvas');
    cv.width = cols * cellW;
    cv.height = rows * cellH;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = color;
    chars.forEach((ch, i) => {
      const rowsG = font.glyphs[ch];
      const ox = (i % cols) * cellW;
      const oy = Math.floor(i / cols) * cellH;
      for (let y = 0; y < rowsG.length; y++) {
        const row = rowsG[y];
        for (let x = 0; x < row.length; x++) {
          if (row[x] === '#') ctx.fillRect(ox + x, oy + y, 1, 1);
        }
      }
    });
    return { canvas: cv, index: Object.fromEntries(chars.map((c, i) => [c, i])), cols, cellW, cellH };
  }

  const font = {
    PALETTE,
    atlas(color) {
      const key = color in PALETTE ? color : 'custom';
      if (!cache[key]) cache[key] = buildAtlas(key === 'custom' ? color : PALETTE[key]);
      return cache[key];
    },
    width(text, scale = 1, spacing = 0) {
      const f = FD.assets.fontRef;
      return text.length * (f.advance + spacing) * scale - spacing * scale;
    },
    // opts: scale, color, shadow (colour or null), align ('left'|'center'|'right'),
    //       alpha, spacing
    draw(ctx, text, x, y, opts = {}) {
      const color = opts.color || 'white';
      const scale = opts.scale || 1;
      const shadow = opts.shadow === undefined ? 'ink' : opts.shadow;
      const spacing = opts.spacing || 0;
      const alpha = opts.alpha === undefined ? 1 : opts.alpha;
      const f = FD.assets.fontRef;
      const adv = (f.advance + spacing) * scale;
      let px = x;
      const upper = String(text).toUpperCase();
      const w = upper.length * adv - spacing * scale;
      if (opts.align === 'center') px = Math.round(x - w / 2);
      else if (opts.align === 'right') px = Math.round(x - w);
      px = Math.round(px);
      const py = Math.round(y);
      ctx.save();
      ctx.globalAlpha = alpha;
      if (shadow) {
        this._blit(ctx, upper, px + scale, py + scale, this.atlas(shadow), scale, adv, spacing);
      }
      this._blit(ctx, upper, px, py, this.atlas(color), scale, adv, spacing);
      ctx.restore();
      return w;
    },
    _blit(ctx, text, x, y, atlas, scale, adv, spacing) {
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (ch === ' ') continue;
        const idx = atlas.index[ch];
        if (idx === undefined) continue;
        const sx = (idx % atlas.cols) * atlas.cellW;
        const sy = Math.floor(idx / atlas.cols) * atlas.cellH;
        ctx.drawImage(atlas.canvas, sx, sy, atlas.cellW, atlas.cellH,
          Math.round(x + i * adv), Math.round(y), atlas.cellW * scale, atlas.cellH * scale);
      }
    },
  };

  FD.font = font;
})();

</script>

// Keyboard + gamepad input mapped to five abstract actions.
(function () {
  'use strict';
  const FD = window.FD;

  const KEYMAP = {
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'up', KeyW: 'up',
    ArrowDown: 'down', KeyS: 'down',
    KeyJ: 'attack', KeyZ: 'attack',
    KeyK: 'jump', KeyX: 'jump', Space: 'jump',
    KeyL: 'special', KeyC: 'special',
    Enter: 'start', Escape: 'pause',
    KeyP: 'pause', KeyH: 'help', KeyM: 'mute', F2: 'debug', Backquote: 'debug',
  };

  const BTN = {
    0: 'attack', 1: 'jump', 2: 'special', 3: 'special',
    9: 'start', 8: 'pause',
    12: 'up', 13: 'down', 14: 'left', 15: 'right',
  };

  const state = {
    held: Object.create(null),
    pressed: Object.create(null),
    released: Object.create(null),
    anyPressed: false,
    enabled: true,
    touch: false,
    lastDevice: 'keyboard',
  };

  const actions = ['left', 'right', 'up', 'down', 'attack', 'jump', 'special', 'start', 'pause', 'help', 'mute', 'debug'];

  function press(action) {
    if (!action) return;
    if (!state.held[action]) state.pressed[action] = true;
    state.held[action] = true;
    state.anyPressed = true;
  }
  function release(action) {
    if (!action) return;
    if (state.held[action]) state.released[action] = true;
    state.held[action] = false;
  }

  window.addEventListener('keydown', (e) => {
    const action = KEYMAP[e.code];
    if (action) {
      e.preventDefault();
      if (!e.repeat) press(action);
      state.lastDevice = 'keyboard';
    }
    if (e.code === 'Enter' || e.code === 'Space') e.preventDefault();
  }, { passive: false });

  window.addEventListener('keyup', (e) => {
    const action = KEYMAP[e.code];
    if (action) {
      e.preventDefault();
      release(action);
    }
  }, { passive: false });

  window.addEventListener('blur', () => {
    actions.forEach(release);
    state.held = Object.create(null);
  });

  // Simple on-screen controls for touch devices.
  function bindTouch(root) {
    const buttons = root.querySelectorAll('[data-action]');
    buttons.forEach((btn) => {
      const action = btn.getAttribute('data-action');
      const down = (e) => { e.preventDefault(); state.touch = true; press(action); btn.classList.add('active'); };
      const up = (e) => { e.preventDefault(); release(action); btn.classList.remove('active'); };
      btn.addEventListener('touchstart', down, { passive: false });
      btn.addEventListener('touchend', up, { passive: false });
      btn.addEventListener('touchcancel', up, { passive: false });
      btn.addEventListener('mousedown', down);
      btn.addEventListener('mouseup', up);
      btn.addEventListener('mouseleave', up);
    });
  }

  const input = {
    state,
    actions,
    press,
    release,
    bindTouch,
    isDown: (a) => !!state.held[a],
    wasPressed: (a) => !!state.pressed[a],
    wasReleased: (a) => !!state.released[a],
    axisX() { return (state.held.right ? 1 : 0) - (state.held.left ? 1 : 0); },
    axisY() { return (state.held.down ? 1 : 0) - (state.held.up ? 1 : 0); },
    pollGamepad() {
      if (!navigator.getGamepads) return;
      const pads = navigator.getGamepads();
      for (const pad of pads) {
        if (!pad) continue;
        for (const [index, action] of Object.entries(BTN)) {
          const b = pad.buttons[index];
          if (!b) continue;
          if (b.pressed) press(action);
          else release(action);
        }
        const ax = pad.axes[0] || 0;
        const ay = pad.axes[1] || 0;
        if (ax < -0.35) press('left'); else if (ax > 0.35) press('right');
        if (ay < -0.35) press('up'); else if (ay > 0.35) press('down');
        if (ax >= -0.35 && ax <= 0.35) { release('left'); release('right'); }
        if (ay >= -0.35 && ay <= 0.35) { release('up'); release('down'); }
        state.lastDevice = 'gamepad';
      }
    },
    endTick() {
      state.pressed = Object.create(null);
      state.released = Object.create(null);
      state.anyPressed = false;
    },
  };

  FD.input = input;
})();

<script>
/* ---- src/audio.js ---- */
// Procedural WebAudio: synthesized SFX, a looping stage track and rain bed.
// Nothing is sampled from a commercial game; all buffers are generated here.
(function () {
  'use strict';
  const FD = window.FD;

  let ctx = null;
  let master = null;
  let musicGain = null;
  let sfxGain = null;
  let rainGain = null;
  let muted = false;
  let started = false;
  let musicSource = null;

  function makeNoiseBuffer(seconds, secondsSeed = 1) {
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      const white = Math.random() * 2 - 1;
      last = 0.96 * last + 0.04 * white;
      d[i] = white * 0.7 + last * 0.6;
    }
    return buf;
  }

  function synthPunch(heavy) {
    const dur = heavy ? 0.24 : 0.15;
    const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) {
      const t = i / ctx.sampleRate;
      const env = Math.exp(-t * (heavy ? 26 : 42));
      const thump = Math.sin(2 * Math.PI * (heavy ? 78 : 122) * t) * env;
      const crack = (Math.random() * 2 - 1) * env * (heavy ? 0.5 : 0.32);
      d[i] = (thump * 0.8 + crack) * 0.9;
    }
    return buf;
  }

  function synthZap() {
    const dur = 0.55;
    const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
    const d = buf.getChannelData(0);
    let phase = 0;
    for (let i = 0; i < d.length; i++) {
      const t = i / ctx.sampleRate;
      const env = Math.exp(-t * 6) * (0.6 + 0.4 * Math.sin(t * 90));
      const f = 1400 - 1100 * Math.min(1, t / dur);
      phase += (2 * Math.PI * f) / ctx.sampleRate;
      const tone = Math.sin(phase) * 0.45 + (Math.random() * 2 - 1) * 0.25;
      d[i] = tone * env * 0.8;
    }
    return buf;
  }

  function synthHurt() {
    const dur = 0.22;
    const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) {
      const t = i / ctx.sampleRate;
      const env = Math.exp(-t * 18);
      const f = 380 - 160 * (t / dur);
      d[i] = (Math.sin(2 * Math.PI * f * t) * 0.5 + (Math.random() * 2 - 1) * 0.2) * env;
    }
    return buf;
  }

  function synthPickup() {
    const dur = 0.3;
    const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
    const d = buf.getChannelData(0);
    const notes = [880, 1320, 1760];
    for (let i = 0; i < d.length; i++) {
      const t = i / ctx.sampleRate;
      const step = Math.min(2, Math.floor(t / 0.08));
      const env = Math.exp(-((t - step * 0.08) * 22));
      d[i] = Math.sin(2 * Math.PI * notes[step] * t) * env * 0.35;
    }
    return buf;
  }

  function synthBreak() {
    const dur = 0.4;
    const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) {
      const t = i / ctx.sampleRate;
      const env = Math.exp(-t * 9);
      d[i] = (Math.random() * 2 - 1) * env * (0.5 + 0.5 * Math.sin(t * 60));
    }
    return buf;
  }

  function synthSelect() {
    const dur = 0.12;
    const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) {
      const t = i / ctx.sampleRate;
      d[i] = Math.sin(2 * Math.PI * 660 * t) * Math.exp(-t * 20) * 0.3;
    }
    return buf;
  }

  const buffers = {};

  function buildStageMusic() {
    // 8 bars of 16th notes at 128 BPM, 4/4. Original composition.
    const bpm = 128;
    const beat = 60 / bpm;
    const bars = 8;
    const total = beat * 4 * bars;
    const sr = ctx.sampleRate;
    const buf = ctx.createBuffer(2, Math.floor(sr * total), sr);
    const L = buf.getChannelData(0);
    const R = buf.getChannelData(1);
    const bassNotes = [55, 55, 65.4, 49, 55, 55, 73.4, 49]; // A1 A1 C2 G1 ... a minor-ish loop
    const leadNotes = [220, 261.6, 329.6, 392, 329.6, 261.6, 293.7, 246.9];
    const steps = 16 * 4;
    const stepDur = total / (steps * bars / 8) / 4;
    const sixteenth = beat / 4;
    for (let bar = 0; bar < bars; bar++) {
      for (let s = 0; s < 16; s++) {
        const t0 = bar * beat * 4 + s * sixteenth;
        const idx = Math.floor((t0 / total) * steps) % steps;
        // kick on 1 and 3
        if (s % 8 === 0 || s === 10) {
          addKick(L, R, t0, sr);
        }
        // snare on 2 and 4
        if (s === 4 || s === 12) addSnare(L, R, t0, sr);
        // hats on every off 8th
        if (s % 2 === 1) addHat(L, R, t0, sr);
        // bass on 8ths
        if (s % 2 === 0) {
          const n = bassNotes[(bar + Math.floor(s / 8)) % bassNotes.length];
          addBass(L, R, t0, n, sixteenth * 1.6, sr);
        }
        // arpeggio lead on a sparse pattern
        if ([0, 3, 6, 10, 13].includes(s)) {
          const n = leadNotes[(bar * 2 + s) % leadNotes.length] * (bar >= 4 ? 1.5 : 1);
          addLead(L, R, t0, n, sixteenth * 1.2, sr);
        }
      }
    }
    // gentle bus compression via soft clip
    for (let i = 0; i < L.length; i++) {
      L[i] = Math.tanh(L[i] * 1.2) * 0.7;
      R[i] = Math.tanh(R[i] * 1.2) * 0.7;
    }
    return buf;
  }

  function addKick(L, R, t0, sr) {
    const start = Math.floor(t0 * sr);
    const n = Math.floor(0.22 * sr);
    for (let i = 0; i < n && start + i < L.length; i++) {
      const t = i / sr;
      const f = 120 * Math.exp(-t * 30) + 42;
      const v = Math.sin(2 * Math.PI * f * t) * Math.exp(-t * 14) * 0.85;
      L[start + i] += v;
      R[start + i] += v;
    }
  }
  function addSnare(L, R, t0, sr) {
    const start = Math.floor(t0 * sr);
    const n = Math.floor(0.18 * sr);
    for (let i = 0; i < n && start + i < L.length; i++) {
      const t = i / sr;
      const env = Math.exp(-t * 24);
      const noise = Math.random() * 2 - 1;
      const body = Math.sin(2 * Math.PI * 190 * t) * 0.4;
      L[start + i] += (noise * 0.5 + body) * env * 0.45;
      R[start + i] += (noise * 0.5 + body) * env * 0.45;
    }
  }
  function addHat(L, R, t0, sr) {
    const start = Math.floor(t0 * sr);
    const n = Math.floor(0.05 * sr);
    for (let i = 0; i < n && start + i < L.length; i++) {
      const t = i / sr;
      const v = (Math.random() * 2 - 1) * Math.exp(-t * 60) * 0.12;
      L[start + i] += v * 0.8;
      R[start + i] += v;
    }
  }
  function addBass(L, R, t0, freq, dur, sr) {
    const start = Math.floor(t0 * sr);
    const n = Math.floor(dur * sr);
    for (let i = 0; i < n && start + i < L.length; i++) {
      const t = i / sr;
      const env = Math.min(1, t * 80) * Math.exp(-t * 2.2);
      const v = (Math.sin(2 * Math.PI * freq * t) + 0.4 * Math.sin(2 * Math.PI * freq * 2 * t)) * env * 0.32;
      L[start + i] += v;
      R[start + i] += v;
    }
  }
  function addLead(L, R, t0, freq, dur, sr) {
    const start = Math.floor(t0 * sr);
    const n = Math.floor(dur * sr);
    for (let i = 0; i < n && start + i < L.length; i++) {
      const t = i / sr;
      const env = Math.min(1, t * 120) * Math.exp(-t * 7);
      const v = (Math.sin(2 * Math.PI * freq * t) * 0.18 + Math.sin(2 * Math.PI * freq * 1.005 * t) * 0.1) * env;
      L[start + i] += v * 0.7;
      R[start + i] += v;
    }
  }

  function playBuffer(buf, gainNode, when = 0, loop = false) {
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.loop = loop;
    src.connect(gainNode);
    src.start(ctx.currentTime + when);
    return src;
  }

  const audio = {
    get available() { return !!ctx; },
    get muted() { return muted; },

    init() {
      if (ctx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.8;
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -18;
      comp.knee.value = 12;
      comp.ratio.value = 5;
      master.connect(comp);
      comp.connect(ctx.destination);
      musicGain = ctx.createGain();
      musicGain.gain.value = 0.34;
      musicGain.connect(master);
      sfxGain = ctx.createGain();
      sfxGain.gain.value = 0.65;
      sfxGain.connect(master);
      rainGain = ctx.createGain();
      rainGain.gain.value = 0.0;
      rainGain.connect(master);
      buffers.punch = synthPunch(false);
      buffers.punchHeavy = synthPunch(true);
      buffers.zap = synthZap();
      buffers.hurt = synthHurt();
      buffers.pickup = synthPickup();
      buffers.break = synthBreak();
      buffers.select = synthSelect();
      buffers.music = buildStageMusic();
      buffers.rain = makeNoiseBuffer(4);
    },

    async unlock() {
      if (!ctx) this.init();
      if (!ctx) return;
      if (ctx.state === 'suspended') await ctx.resume();
      if (!started) {
        started = true;
        musicSource = playBuffer(buffers.music, musicGain, 0, true);
        const rain = ctx.createBufferSource();
        rain.buffer = buffers.rain;
        rain.loop = true;
        const lp = ctx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 1600;
        rain.connect(lp);
        lp.connect(rainGain);
        rain.start();
        rainGain.gain.setTargetAtTime(0.09, ctx.currentTime, 1.2);
      }
    },

    setMuted(m) {
      muted = m;
      if (!ctx) return;
      master.gain.setTargetAtTime(m ? 0 : 0.8, ctx.currentTime, 0.05);
      try { localStorage.setItem('fd-muted', m ? '1' : '0'); } catch (e) { /* ignore */ }
    },

    restoreMuted() {
      try { muted = localStorage.getItem('fd-muted') === '1'; } catch (e) { muted = false; }
      if (ctx) master.gain.value = muted ? 0 : 0.8;
    },

    duckMusic(onStage) {
      if (!ctx) return;
      musicGain.gain.setTargetAtTime(onStage ? 0.34 : 0.12, ctx.currentTime, 0.4);
      rainGain.gain.setTargetAtTime(onStage ? 0.09 : 0.02, ctx.currentTime, 0.6);
    },

    play(name, opts = {}) {
      if (!ctx || muted) return;
      const map = {
        punch: ['punch', 0.9], punch_heavy: ['punchHeavy', 1.0], kick_heavy: ['punchHeavy', 1.1],
        zap: ['zap', 1.0], hurt: ['hurt', 0.9], pickup: ['pickup', 0.8],
        break: ['break', 0.8], select: ['select', 0.7], land: ['punch', 0.35],
      };
      const entry = map[name];
      if (!entry) return;
      const [bufName, vol] = entry;
      const g = ctx.createGain();
      g.gain.value = vol * (opts.volume === undefined ? 1 : opts.volume);
      g.connect(sfxGain);
      const src = ctx.createBufferSource();
      src.buffer = buffers[bufName];
      if (opts.rate) src.playbackRate.value = opts.rate;
      src.connect(g);
      src.start();
    },

    stopMusic() {
      if (musicSource) {
        try { musicSource.stop(); } catch (e) { /* already stopped */ }
        musicSource = null;
      }
    },
  };

  FD.audio = audio;
})();

<script>
/* ---- src/actors.js ---- */
// Actor state machines: player (VOLT) and the RIVET enemy archetypes.
// All timing comes from config/animation.json, all numbers from the config
// bundle.  Nothing here is hard-coded per animation frame.
(function () {
  'use strict';
  const FD = window.FD;
  const A = {};

  // ------------------------------------------------------------------ helpers
  function charCfg(charId) {
    return FD.characterCfg(charId);
  }
  function animCfg(charId, anim) {
    const c = charCfg(charId);
    return c ? c.animations[anim] : null;
  }
  function frameCount(charId, anim) {
    const a = animCfg(charId, anim);
    return a ? a.frames.length : 1;
  }
  A.frameCount = frameCount;

  function setAnim(actor, name, resetHitSet = true) {
    const def = animCfg(actor.charId, name);
    if (!def) throw new Error(`missing animation ${actor.charId}/${name}`);
    actor.anim = name;
    actor.frame = 0;
    actor.frameTicks = 0;
    actor.animTicks = 0;
    if (resetHitSet) actor.hitSet.clear();
    return def;
  }
  A.setAnim = setAnim;

  // Advances the animation clock. Returns true when a non-looping animation
  // has just finished.
  function advanceAnim(actor, ticks = 1) {
    const def = animCfg(actor.charId, actor.anim);
    if (!def) return true;
    for (let i = 0; i < ticks; i++) {
      actor.animTicks += 1;
      actor.frameTicks += 1;
      const frame = def.frames[actor.frame];
      if (actor.frameTicks >= frame.dur) {
        actor.frameTicks = 0;
        if (actor.frame + 1 < def.frames.length) {
          actor.frame += 1;
        } else if (def.loop) {
          actor.frame = 0;
        } else if (def.hold) {
          actor.frame = def.frames.length - 1;
          return true;
        } else {
          actor.finished = true;
          return true;
        }
      }
    }
    return false;
  }
  A.advanceAnim = advanceAnim;

  function currentFrame(actor) {
    const def = animCfg(actor.charId, actor.anim);
    return def ? def.frames[Math.min(actor.frame, def.frames.length - 1)] : null;
  }
  A.currentFrame = currentFrame;

  function activeHit(actor) {
    const f = currentFrame(actor);
    return f && f.hit ? f.hit : null;
  }

  // World-space attack box for the current frame.
  function hitBoxFor(actor, rect, depthBonus = 0) {
    const halfDepth = (actor.depthTolerance || 14) + depthBonus;
    const top = actor.z - actor.yOffset + rect.y;
    if (actor.facing >= 0) {
      return { x: actor.x + rect.x, y: top, w: rect.w, h: rect.h, zMin: actor.z - halfDepth, zMax: actor.z + halfDepth };
    }
    return { x: actor.x - rect.x - rect.w, y: top, w: rect.w, h: rect.h, zMin: actor.z - halfDepth, zMax: actor.z + halfDepth };
  }
  A.hitBoxFor = hitBoxFor;

  function hurtBoxFor(actor) {
    const c = FD.cfg.collision[actor.kind === 'player' ? 'player' : 'enemy'];
    const top = actor.z - actor.yOffset - c.bodyHeight;
    return {
      x: actor.x - c.bodyWidth / 2, y: top, w: c.bodyWidth, h: c.bodyHeight,
      zMin: actor.z - c.depthTolerance, zMax: actor.z + c.depthTolerance,
    };
  }
  A.hurtBoxFor = hurtBoxFor;

  function boxesOverlap(a, b) {
    if (!FD.rectsOverlap(a, b)) return false;
    return a.zMin <= b.zMax && a.zMax >= b.zMin;
  }
  A.boxesOverlap = boxesOverlap;

  function depthDistance(a, b) {
    return Math.abs(a.z - b.z);
  }

  // ------------------------------------------------------------------ player
  A.createPlayer = function (game, x, z) {
    const combat = FD.cfg.combat.player;
    const mv = FD.cfg.movement.player;
    const col = FD.cfg.collision.player;
    const p = {
      kind: 'player', charId: 'volt', id: 'player',
      x, z, facing: 1,
      state: 'idle', anim: 'idle', frame: 0, frameTicks: 0, animTicks: 0,
      health: combat.maxHealth, maxHealth: combat.maxHealth,
      vx: 0, vz: 0, vy: 0, yOffset: 0,
      invulnTicks: 0, hurtTicks: 0, knockdownTicks: 0,
      specialCooldown: 0, specialSpent: false, attackBuffer: 0, comboIndex: 0, attackId: null,
      attackTicks: 0, chainAtTick: 0, dead: false, hidden: false,
      depthTolerance: col.depthTolerance, bodyWidth: col.bodyWidth, bodyHeight: col.bodyHeight,
      hitSet: new Set(), propHitSet: new Set(),
      spawnGrace: 0, flash: 0, lastAttackLanded: false,
    };
    setAnim(p, 'idle');
    return p;
  };

  function startPlayerAttack(game, p, index) {
    const name = 'attack' + (index + 1);
    const def = FD.cfg.combat.player.attacks[name];
    if (!def) return;
    setAnim(p, name);
    p.state = 'attack';
    p.comboIndex = index;
    p.attackId = name;
    p.attackTicks = 0;
    p.attackBuffer = 0;
    p.lastAttackLanded = false;
    p.propHitSet.clear();
    const frames = animCfg('volt', name).frames;
    let lastHit = 0;
    let t = 0;
    frames.forEach((f) => {
      if (f.hit) lastHit = t + f.dur;
      t += f.dur;
    });
    p.chainAtTick = lastHit;
    p.vx = p.facing * 0.55 * (index === 2 ? 2.2 : 1);
    FD.sfx('whoosh', { volume: 0.25 });
  }

  function startPlayerJump(game, p) {
    const mv = FD.cfg.movement.player;
    p.state = 'jump';
    setAnim(p, 'jump');
    p.vy = Math.abs(mv.jumpVelocity);
    p.yOffset = 0.01;
    p.vx = p.facing * Math.abs(mv.walkSpeed) * 0.92;
    p.vz = p.vz * 0.5;
    FD.sfx('land', { volume: 0.3, rate: 1.6 });
  }

  function startPlayerSpecial(game, p) {
    const sp = FD.cfg.combat.player.special;
    if (p.specialCooldown > 0) return;
    setAnim(p, 'special');
    p.state = 'special';
    p.attackId = 'special';
    p.specialCooldown = sp.cooldownTicks;
    p.invulnTicks = Math.max(p.invulnTicks, sp.invulnTicks);
    p.hitSet.clear();
    p.propHitSet.clear();
    p.specialSpent = false;
    p.vx = 0;
    p.vz = 0;
    game.addEffect({ type: 'shockwave', x: p.x, y: p.z, t: 0, life: 26, facing: p.facing });
    FD.sfx('zap');
    game.audioKick = true;
  }

  // SoR1-style special: the health is only paid when the move connects, the
  // cost is charged once per special (not per target), and it can never kill.
  function spendSpecialCost(game, p) {
    if (p.specialSpent) return;
    p.specialSpent = true;
    const sp = FD.cfg.combat.player.special;
    const cost = sp.healthCost || 0;
    if (!cost) return;
    const before = p.health;
    p.health = Math.max(1, p.health - cost);
    const paid = before - p.health;
    if (paid > 0) {
      game.addEffect({ type: 'damage', x: p.x, y: p.z - 74, t: 0, life: 34, text: `-${paid}`, color: 'red' });
    }
  }

  function playerTakeHit(game, p, amount, opts = {}) {
    if (p.invulnTicks > 0 || p.dead || game.debug.invincible) {
      game.addEffect({ type: 'block', x: p.x, y: p.z - 40, t: 0, life: 10 });
      return false;
    }
    p.health = Math.max(0, p.health - amount);
    if (game.stats) game.stats.damageTaken += amount;
    p.invulnTicks = FD.cfg.combat.player.hurtInvulnTicks;
    p.flash = 6;
    game.hitstop = Math.max(game.hitstop, 3);
    game.shake = Math.max(game.shake, 2.2);
    FD.sfx('hurt');
    game.addEffect({ type: 'hit', x: p.x, y: p.z - 42, t: 0, life: 14, color: '#ff5a52', dir: opts.dir || -p.facing });
    game.addEffect({ type: 'damage', x: p.x, y: p.z - 62, t: 0, life: 38, text: String(amount), color: 'red' });
    if (p.health <= 0) {
      p.dead = true;
      p.state = 'fall';
      setAnim(p, 'fall');
      p.vy = 2.6;
      p.vx = (opts.dir || -p.facing) * 1.4;
      p.knockdownTicks = FD.cfg.combat.player.knockdownTicks;
      FD.sfx('punch_heavy');
      return true;
    }
    if (opts.knockdown) {
      p.state = 'fall';
      setAnim(p, 'fall');
      p.vy = 2.2;
      p.vx = (opts.dir || -p.facing) * Math.max(1.5, opts.knockback || 2);
      p.knockdownTicks = FD.cfg.combat.player.knockdownTicks;
    } else {
      p.state = 'hurt';
      setAnim(p, 'hurt');
      p.hurtTicks = FD.cfg.combat.player.hurtTicks;
      p.vx = (opts.dir || -p.facing) * (opts.knockback || 1.2);
    }
    return true;
  }

  A.updatePlayer = function (game, p) {
    const input = FD.input;
    const mv = FD.cfg.movement.player;
    const combat = FD.cfg.combat.player;
    const arena = game.arena();

    p.attackBuffer = Math.max(0, p.attackBuffer - 1);
    p.invulnTicks = Math.max(0, p.invulnTicks - 1);
    p.specialCooldown = Math.max(0, p.specialCooldown - 1);
    p.flash = Math.max(0, p.flash - 1);

    const grounded = p.yOffset <= 0 && p.state !== 'jump' && p.state !== 'jump_attack';

    // ---- incapacitated states
    if (p.state === 'dead') {
      p.vx = FD.approach(p.vx, 0, 0.12);
      p.x = FD.clamp(p.x + p.vx, arena.minX, arena.maxX);
      return;
    }
    if (p.state === 'hurt') {
      p.hurtTicks -= 1;
      p.vx = FD.approach(p.vx, 0, 0.22);
      p.x = FD.clamp(p.x + p.vx, arena.minX, arena.maxX);
      advanceAnim(p);
      if (p.hurtTicks <= 0) {
        p.state = 'idle';
        setAnim(p, 'idle');
      }
      return;
    }
    if (p.state === 'fall') {
      // airborne knockback, then lie on the floor
      if (p.yOffset > 0 || p.vy > 0) {
        p.vy -= FD.cfg.movement.player.gravity;
        p.yOffset += p.vy;
        p.x = FD.clamp(p.x + p.vx, arena.minX, arena.maxX);
        p.vx = FD.approach(p.vx, 0, 0.06);
        if (p.yOffset <= 0) {
          p.yOffset = 0;
          p.vy = 0;
          p.vx = 0;
          game.shake = Math.max(game.shake, 2.4);
          FD.sfx('land', { volume: 0.5 });
          game.addEffect({ type: 'dust', x: p.x, y: p.z, t: 0, life: 16 });
        }
        advanceAnim(p);
      } else {
        p.knockdownTicks -= 1;
        p.yOffset = 0;
        advanceAnim(p);
        if (p.knockdownTicks <= 0) {
          if (p.dead) {
            p.state = 'dead';
            advanceAnim(p);
            p.frame = frameCount('volt', 'fall') - 1;
            game.onPlayerDead();
          } else {
            p.state = 'getup';
            setAnim(p, 'getup');
            p.invulnTicks = Math.max(p.invulnTicks, combat.getupInvulnTicks);
            FD.sfx('select', { volume: 0.35 });
          }
        }
      }
      return;
    }
    if (p.state === 'getup') {
      if (advanceAnim(p)) {
        p.state = 'idle';
        setAnim(p, 'idle');
      }
      return;
    }
    if (p.state === 'victory') {
      advanceAnim(p);
      return;
    }

    // ---- attacks
    if (p.state === 'attack' || p.state === 'special') {
      p.attackTicks += 1;
      p.vx = FD.approach(p.vx, 0, 0.1);
      p.x = FD.clamp(p.x + p.vx, arena.minX, arena.maxX);
      if (p.state === 'attack' && input.wasPressed('attack')) {
        p.attackBuffer = combat.attackBufferTicks;
      }
      const finished = advanceAnim(p);
      if (p.state === 'attack' && p.attackBuffer > 0 && p.comboIndex < 2 && p.attackTicks >= p.chainAtTick) {
        startPlayerAttack(game, p, p.comboIndex + 1);
        return;
      }
      if (finished) {
        p.state = 'idle';
        setAnim(p, 'idle');
      }
      return;
    }

    // ---- air states
    if (p.state === 'jump' || p.state === 'jump_attack') {
      const g = FD.cfg.movement.player.gravity;
      p.vy -= g;
      p.yOffset += p.vy;
      p.x = FD.clamp(p.x + p.vx, arena.minX, arena.maxX);
      if (p.state === 'jump') {
        if (input.wasPressed('attack') || input.wasPressed('special')) {
          p.state = 'jump_attack';
          setAnim(p, 'jump_attack');
          p.attackId = 'jump_attack';
          p.propHitSet.clear();
          p.hitSet.clear();
          p.vx = p.facing * 1.1;
          FD.sfx('whoosh', { volume: 0.3 });
        } else {
          const f = p.vy > 1.2 ? 1 : p.vy > -1.2 ? 2 : 3;
          p.frame = Math.min(f, frameCount('volt', 'jump') - 1);
        }
      } else {
        advanceAnim(p);
      }
      if (p.yOffset <= 0) {
        p.yOffset = 0;
        p.vy = 0;
        p.state = 'land';
        setAnim(p, 'idle');
        p.frame = 0;
        p.landTicks = mv.landRecoveryTicks;
        game.addEffect({ type: 'dust', x: p.x, y: p.z, t: 0, life: 14 });
        FD.sfx('land');
      }
      return;
    }
    if (p.state === 'land') {
      p.landTicks -= 1;
      p.vx = FD.approach(p.vx, 0, 0.3);
      p.x = FD.clamp(p.x + p.vx, arena.minX, arena.maxX);
      if (p.landTicks <= 0) {
        p.state = 'idle';
        setAnim(p, 'idle');
      }
      return;
    }

    // ---- free movement
    const ax = input.axisX();
    const ay = input.axisY();
    if (input.wasPressed('special') && p.specialCooldown <= 0) {
      startPlayerSpecial(game, p);
      return;
    }
    if (input.wasPressed('attack')) {
      startPlayerAttack(game, p, 0);
      return;
    }
    if (input.wasPressed('jump')) {
      startPlayerJump(game, p);
      return;
    }

    if (ax !== 0) {
      p.facing = ax;
      p.vx = FD.approach(p.vx, ax * mv.walkSpeed, mv.accel);
    } else {
      p.vx = FD.approach(p.vx, 0, mv.decel);
    }
    p.vz = FD.approach(p.vz, ay * mv.depthSpeed, mv.accel * 1.15);
    p.x = FD.clamp(p.x + p.vx, arena.minX, arena.maxX);
    p.z = FD.clamp(p.z + p.vz, FD.cfg.stage.laneMin, FD.cfg.stage.laneMax);

    const moving = Math.abs(p.vx) > 0.15 || Math.abs(p.vz) > 0.15;
    if (moving) {
      if (p.state !== 'walk') {
        p.state = 'walk';
        setAnim(p, 'walk');
      } else {
        advanceAnim(p);
      }
    } else {
      if (p.state !== 'idle') {
        p.state = 'idle';
        setAnim(p, 'idle');
      } else {
        advanceAnim(p);
      }
    }
  };

  // ------------------------------------------------------------------ enemy
  A.createEnemy = function (game, type, x, z, opts = {}) {
    const def = FD.cfg.combat.enemyTypes[type];
    if (!def) throw new Error('unknown enemy type ' + type);
    const col = FD.cfg.collision.enemy;
    const st = FD.cfg.stage || {};
    const hpMul = opts.healthMul || st.enemyHealthMul || 1;
    const dmgMul = opts.damageMul || st.enemyDamageMul || 1;
    const maxHealth = Math.max(1, Math.round(def.maxHealth * hpMul));
    const sheet = def.elite ? 'rivet_elite' : (type === 'rivet' ? 'rivet' : type);
    const e = {
      kind: 'enemy', charId: type === 'rivet_elite' ? 'rivet_elite' : 'rivet', sheet, type, id: opts.id || `e${Math.random().toString(36).slice(2, 7)}`,
      x, z, facing: -1,
      state: 'spawn', anim: 'walk', frame: 0, frameTicks: 0, animTicks: 0,
      health: maxHealth, maxHealth,
      vx: 0, vz: 0, vy: 0, yOffset: 0,
      def, invulnTicks: 0, hurtTicks: 0, knockdownTicks: 0, cooldown: opts.cooldown || 30,
      decisionTicks: 0, side: opts.side || (x < game.player.x ? -1 : 1),
      attackId: null, attackTicks: 0, dead: false, defeatedTicks: 0,
      depthTolerance: col.depthTolerance, bodyWidth: col.bodyWidth, bodyHeight: col.bodyHeight,
      drawScale: def.drawScale || 1, boss: !!def.boss,
      attackDamage: Math.max(1, Math.round(def.attackDamage * dmgMul)),
      hitSet: new Set(), propHitSet: new Set(),
      flash: 0, spawnTicks: 0, alpha: 0, safeTime: 30,
      zJitter: (Math.random() * 2 - 1) * 5,
      retreatTicks: 0, lastAttackAt: -999,
    };
    setAnim(e, 'walk');
    return e;
  };

  function startEnemyAttack(game, e) {
    setAnim(e, 'attack');
    e.state = 'attack';
    e.attackId = 'enemy_attack';
    e.attackTicks = 0;
    e.lastAttackAt = game.tick;
    FD.sfx('whoosh', { volume: 0.22, rate: 0.8 });
  }

  function enemyTakeHit(game, e, damage, def, dir) {
    if (e.state === 'defeated' || e.state === 'fall') {
      // small chip damage while down is not allowed: keeps state machine simple
      return false;
    }
    e.health = Math.max(0, e.health - damage);
    e.flash = 6;
    e.invulnTicks = 4;
    game.addEffect({ type: 'hit', x: e.x, y: e.z - 44, t: 0, life: 14, color: '#8ff9ff', dir });
    game.addEffect({ type: 'damage', x: e.x, y: e.z - 64, t: 0, life: 40, text: String(damage), color: 'cyan' });
    game.hitstop = Math.max(game.hitstop, def.hitstop || 3);
    game.shake = Math.max(game.shake, def.shake || 1.4);
    if (def.sfx) FD.sfx(def.sfx);
    if (e.health <= 0) {
      e.state = 'fall';
      setAnim(e, 'fall');
      e.vy = 2.4;
      e.vx = dir * Math.max(1.4, def.knockback || 2);
      e.knockdownTicks = e.def.knockdownTicks;
      e.dying = true;
      if (game.stats) game.stats.enemiesDefeated += 1;
      game.addScore(e.def.score);
      game.addEffect({ type: 'ko', x: e.x, y: e.z - 70, t: 0, life: 46 });
    } else if (def.knockdown) {
      e.state = 'fall';
      setAnim(e, 'fall');
      e.vy = 2.0;
      e.vx = dir * (def.knockback || 2);
      e.knockdownTicks = e.def.knockdownTicks;
    } else {
      e.state = 'hurt';
      setAnim(e, 'hurt');
      e.hurtTicks = e.def.hurtTicks;
      e.vx = dir * (def.knockback || 1.2);
      e.cooldown = Math.max(e.cooldown, 18);
    }
    return true;
  }
  A.enemyTakeHit = enemyTakeHit;

  A.updateEnemy = function (game, e) {
    const arena = game.enemyArena();
    const p = game.player;
    e.flash = Math.max(0, e.flash - 1);
    e.invulnTicks = Math.max(0, e.invulnTicks - 1);
    e.safeTime = Math.max(0, e.safeTime - 1);
    e.cooldown = Math.max(0, e.cooldown - 1);
    e.decisionTicks = Math.max(0, e.decisionTicks - 1);

    if (e.state === 'defeated') {
      e.defeatedTicks += 1;
      e.alpha = FD.clamp(1 - e.defeatedTicks / 70, 0, 1);
      advanceAnim(e);
      return;
    }
    if (e.state === 'spawn') {
      e.spawnTicks += 1;
      e.alpha = FD.clamp(e.spawnTicks / 24, 0, 1);
      // walk in from outside the screen
      const dir = e.x > game.camera.x + 240 ? -1 : 1;
      e.facing = dir;
      e.x += dir * e.def.walkSpeed * 1.15;
      e.z = FD.approach(e.z, e.z + e.zJitter, 0.2);
      advanceAnim(e);
      const onScreen = e.x > game.camera.x + 24 && e.x < game.camera.x + 456;
      if (onScreen || e.spawnTicks > 140) {
        e.state = 'approach';
        e.decisionTicks = 0;
      }
      return;
    }
    if (e.state === 'hurt') {
      e.hurtTicks -= 1;
      e.vx = FD.approach(e.vx, 0, 0.22);
      e.x = FD.clamp(e.x + e.vx, arena.minX, arena.maxX);
      advanceAnim(e);
      if (e.hurtTicks <= 0) {
        e.state = 'approach';
        e.cooldown = Math.max(e.cooldown, 10);
      }
      return;
    }
    if (e.state === 'fall') {
      if (e.yOffset > 0 || e.vy > 0) {
        e.vy -= FD.cfg.movement.enemy.gravity;
        e.yOffset += e.vy;
        e.x = FD.clamp(e.x + e.vx, arena.minX, arena.maxX);
        e.vx = FD.approach(e.vx, 0, 0.05);
        if (e.yOffset <= 0) {
          e.yOffset = 0;
          e.vy = 0;
          e.vx = 0;
          game.addEffect({ type: 'dust', x: e.x, y: e.z, t: 0, life: 14 });
          FD.sfx('land', { volume: 0.35 });
        }
        advanceAnim(e);
      } else {
        e.knockdownTicks -= 1;
        advanceAnim(e);
        if (e.knockdownTicks <= 0) {
          if (e.dying) {
            e.state = 'defeated';
            e.defeatedTicks = 0;
            setAnim(e, 'defeated');
          } else {
            e.state = 'getup';
            setAnim(e, 'getup');
            e.invulnTicks = 46;
          }
        }
      }
      return;
    }
    if (e.state === 'getup') {
      if (advanceAnim(e)) {
        e.state = 'approach';
        e.cooldown = 24;
      }
      return;
    }
    if (e.state === 'attack') {
      e.attackTicks += 1;
      const finished = advanceAnim(e);
      if (finished) {
        e.state = 'approach';
        e.cooldown = e.def.attackCooldownTicks;
        if (Math.random() < e.def.retreatChance) {
          e.retreatTicks = 26;
          e.side = -e.side;
        }
      }
      return;
    }

    // ---- approach / idle
    if (e.state === 'idle') {
      e.decisionTicks -= 1;
      advanceAnim(e);
      if (e.decisionTicks <= 0) e.state = 'approach';
      return;
    }

    // approach: choose a side, keep spacing, attack when in range
    if (e.decisionTicks <= 0) {
      e.decisionTicks = 18 + Math.floor(Math.random() * 12);
      // flanking: if another enemy already holds this side, switch
      const sameSide = game.enemies.some(
        (o) => o !== e && o.state !== 'defeated' && Math.sign(o.x - p.x) === e.side && Math.abs(o.x - p.x) < 40
      );
      if (sameSide || e.x > game.camera.x + 470 || e.x < game.camera.x + 10) e.side = -e.side;
    }
    const targetX = p.x + e.side * e.def.preferredSideOffset;
    const targetZ = FD.clamp(p.z + e.def.preferredDepthOffset + e.zJitter, FD.cfg.stage.laneMin, FD.cfg.stage.laneMax);
    const retreating = e.retreatTicks > 0;
    e.retreatTicks = Math.max(0, e.retreatTicks - 1);
    const goalX = retreating ? p.x + e.side * (e.def.preferredSideOffset + 70) : targetX;
    const dx = goalX - e.x;
    const dz = targetZ - e.z;
    const speed = e.def.walkSpeed;
    const dspeed = e.def.depthSpeed;
    let moving = false;
    if (Math.abs(dx) > 3) {
      e.vx = FD.approach(e.vx, FD.sign(dx) * speed, 0.12);
      e.facing = p.x > e.x ? 1 : -1;
      moving = true;
    } else {
      e.vx = FD.approach(e.vx, 0, 0.16);
    }
    if (Math.abs(dz) > 1.5) {
      e.vz = FD.approach(e.vz, FD.sign(dz) * dspeed, 0.12);
      moving = true;
    } else {
      e.vz = FD.approach(e.vz, 0, 0.16);
    }
    e.x = FD.clamp(e.x + e.vx, arena.minX + 6, arena.maxX - 6);
    e.z = FD.clamp(e.z + e.vz, FD.cfg.stage.laneMin, FD.cfg.stage.laneMax);

    // keep a little personal space from other enemies
    for (const o of game.enemies) {
      if (o === e || o.state === 'defeated') continue;
      if (Math.abs(o.x - e.x) < 22 && Math.abs(o.z - e.z) < 12) {
        const push = (e.x < o.x ? -1 : 1) * 0.35;
        e.x += push;
        e.z += (e.z < o.z ? -1 : 1) * 0.18;
      }
    }

    if (moving) {
      if (e.anim !== 'walk') setAnim(e, 'walk');
      else advanceAnim(e);
    } else {
      if (e.anim !== 'idle') setAnim(e, 'idle');
      else advanceAnim(e);
    }

    // attack decision
    const inRange = Math.abs(p.x - e.x) <= e.def.attackRange + 6;
    const inDepth = Math.abs(p.z - e.z) <= (e.depthTolerance + 4);
    const playerVulnerable = !p.dead && p.state !== 'fall' && p.state !== 'getup' && p.yOffset < 26;
    if (inRange && inDepth && e.cooldown <= 0 && e.safeTime <= 0 && playerVulnerable &&
        game.tick - e.lastAttackAt > 24 && Math.random() < 0.5) {
      startEnemyAttack(game, e);
    }
  };

  // ------------------------------------------------------------------ combat pass
  A.resolveHits = function (game) {
    const p = game.player;
    const hits = [];

    // player -> enemies / props
    if (p.state === 'attack' || p.state === 'special' || p.state === 'jump_attack') {
      const hit = activeHit(p);
      if (hit) {
        const isSpecial = p.state === 'special' && hit.radial;
        if (isSpecial) {
          const sp = FD.cfg.combat.player.special;
          for (const e of game.enemies) {
            if (e.state === 'defeated' || e.state === 'fall') continue;
            if (p.hitSet.has(e.id)) continue;
            const dist = Math.abs(e.x - p.x);
            if (dist <= sp.radius && Math.abs(e.z - p.z) <= sp.depthRadius) {
              p.hitSet.add(e.id);
              if (enemyTakeHit(game, e, sp.damage, sp, FD.sign(e.x - p.x) || p.facing)) {
                game.onPlayerLandedHit(sp, e, isSpecial);
                spendSpecialCost(game, p);
              }
            }
          }
        } else {
          const def = FD.cfg.combat.player.attacks[p.attackId] || FD.cfg.combat.player.special;
          const box = hitBoxFor(p, hit, FD.cfg.collision.rules.attackDepthToleranceBonus);
          for (const e of game.enemies) {
            if (e.state === 'defeated' || e.state === 'fall') continue;
            if (p.hitSet.has(e.id)) continue;
            const hb = hurtBoxFor(e);
            if (boxesOverlap(box, hb)) {
              p.hitSet.add(e.id);
              if (enemyTakeHit(game, e, def.damage, def, FD.sign(e.x - p.x) || p.facing)) {
                game.onPlayerLandedHit(def, e, false);
              }
            }
          }
        }
        // props are hit by any attack frame with a rect (the special uses a radius too)
        for (const prop of game.props) {
          if (prop.broken || p.propHitSet.has(prop.id)) continue;
          const propBox = prop.box();
          let overlaps = false;
          if (isSpecial) {
            const sp = FD.cfg.combat.player.special;
            overlaps = Math.abs(prop.x - p.x) <= sp.radius && Math.abs(prop.z - p.z) <= sp.depthRadius + 6;
          } else {
            overlaps = boxesOverlap(hitBoxFor(p, hit, 6), propBox);
          }
          if (overlaps) {
            p.propHitSet.add(prop.id);
            game.hitProp(prop, isSpecial ? 2 : 1, FD.sign(prop.x - p.x) || p.facing);
            if (isSpecial) spendSpecialCost(game, p);
          }
        }
      }
    }

    // enemies -> player
    for (const e of game.enemies) {
      if (e.state !== 'attack') continue;
      const hit = activeHit(e);
      if (!hit) continue;
      if (e.hitSet.has('player')) continue;
      const box = hitBoxFor(e, hit, 4);
      const hb = hurtBoxFor(p);
      if (boxesOverlap(box, hb)) {
        e.hitSet.add('player');
        const def = { damage: e.attackDamage || e.def.attackDamage, knockdown: false, knockback: 1.4 };
        if (playerTakeHit(game, p, def.damage, { dir: FD.sign(p.x - e.x) || e.facing, knockback: def.knockback })) {
          game.combo.playerHits = 0;
        }
      }
    }
  };

  A.playerTakeHit = playerTakeHit;
  A.startPlayerAttack = startPlayerAttack;
  A.startPlayerSpecial = startPlayerSpecial;
  A.animCfg = animCfg;
  FD.Actors = A;
})();

</script>
<script>
/* ---- src/stage.js ---- */
// Stage flow: waves, props, pickups, camera and the arena bounds.
(function () {
  'use strict';
  const FD = window.FD;
  const S = {};

  S.init = function (game) {
    const st = FD.cfg.stage;
    game.stageState = {
      waveIndex: 0,
      waveActive: false,
      waveLockX: 0,
      clearedWaves: 0,
      pending: [],
      finished: false,
      finishBannerTicks: 0,
      banner: null,
      bannerTicks: 0,
    };
    game.camera.x = 0;
    game.camera.locked = false;
    game.props = st.props.map((p, i) => S.createProp(game, p, i));
    game.pickups = [];
    game.enemies = [];
    game.player = FD.Actors.createPlayer(game, st.startX, st.startZ);
    game.player.facing = 1;
    game.timerTicks = (st.timeLimitSeconds || 99) * 60;
    game.stageStartScore = game.score;
  };

  S.createProp = function (game, def, index) {
    const sizes = { crate: [34, 34], barrel: [26, 36], trash: [24, 30] };
    const [w, h] = sizes[def.type] || [30, 30];
    return {
      id: def.id || `prop_${index}`,
      type: def.type,
      x: def.x,
      z: def.z,
      w,
      h,
      hp: def.hp,
      maxHp: def.hp,
      broken: false,
      hitFlash: 0,
      drop: def.drop,
      box() {
        return {
          x: this.x - this.w / 2,
          y: this.z - this.h,
          w: this.w,
          h: this.h,
          zMin: this.z - FD.cfg.collision.prop.depthTolerance,
          zMax: this.z + FD.cfg.collision.prop.depthTolerance,
        };
      },
    };
  };

  S.spawnEnemy = function (game, def) {
    const st = FD.cfg.stage;
    const cam = game.camera.x;
    let x;
    if (def.spawnSide === 'left') x = cam - 30 - (def.spawnOffset || 0);
    else x = cam + 480 + 30 + (def.spawnOffset || 0) - 500; // offsets are tuned per spawn
    // spawnOffset is measured from the camera edge: right side => cam + 480 + offset
    if (def.spawnSide === 'right') x = cam + 480 + (def.spawnOffset || 40);
    const side = x > game.player.x ? 1 : -1;
    const e = FD.Actors.createEnemy(game, def.type, x, def.spawnZ, {
      side,
      healthMul: def.healthMul || st.enemyHealthMul,
      damageMul: def.damageMul || st.enemyDamageMul,
    });
    game.enemies.push(e);
    game.addEffect({ type: 'spawn', x: clampWorld(x), y: def.spawnZ, t: 0, life: 24 });
    return e;
  };

  function clampWorld(x) {
    return FD.clamp(x, 0, FD.cfg.stage.worldWidth);
  }

  S.update = function (game) {
    const st = FD.cfg.stage;
    const ss = game.stageState;
    const p = game.player;

    // ---- wave progression
    if (!ss.finished) {
      if (!ss.waveActive && ss.waveIndex < st.waves.length) {
        const wave = st.waves[ss.waveIndex];
        if (p.x >= wave.triggerX && p.state !== 'dead') {
          ss.waveActive = true;
          ss.waveLockX = game.camera.x;
          game.camera.locked = true;
          ss.banner = wave.banner || `WAVE ${ss.waveIndex + 1}`;
          ss.bannerTicks = 120;
          FD.sfx('select');
          for (const def of wave.enemies) {
            ss.pending.push({ def, delay: def.delay || 0 });
          }
        }
      }
      if (ss.waveActive) {
        for (let i = ss.pending.length - 1; i >= 0; i--) {
          const item = ss.pending[i];
          item.delay -= 1;
          if (item.delay <= 0) {
            S.spawnEnemy(game, item.def);
            ss.pending.splice(i, 1);
          }
        }
        const alive = game.enemies.filter((e) => e.state !== 'defeated' || e.defeatedTicks < 30);
        if (ss.pending.length === 0 && alive.length === 0 && game.tick > (ss.waveStartTick || 0) + 30) {
          ss.waveActive = false;
          ss.clearedWaves += 1;
          ss.waveIndex += 1;
          game.camera.locked = false;
          ss.banner = ss.waveIndex >= st.waves.length ? null : 'CLEAR';
          ss.bannerTicks = 70;
          game.addScore(500);
          FD.sfx('pickup');
        }
      }
      if (!ss.waveActive && ss.waveIndex >= st.waves.length && p.x >= st.finishLineX) {
        ss.finished = true;
        game.onStageClear();
      }
    }

    // ---- cleanup defeated enemies after the fade
    for (let i = game.enemies.length - 1; i >= 0; i--) {
      if (game.enemies[i].state === 'defeated' && game.enemies[i].defeatedTicks > 80) {
        game.enemies.splice(i, 1);
      }
    }

    // ---- camera
    const cam = game.camera;
    if (cam.locked) {
      cam.x = FD.lerp(cam.x, ss.waveLockX, 0.12);
    } else {
      const lookahead = p.facing * 26;
      const target = FD.clamp(p.x - 240 + lookahead, 0, st.worldWidth - FD.VIEW_W);
      cam.x = FD.lerp(cam.x, target, 0.08);
      if (Math.abs(cam.x - target) < 0.4) cam.x = target;
    }
    cam.x = FD.clamp(cam.x, 0, st.worldWidth - FD.VIEW_W);

    // ---- props
    for (const prop of game.props) {
      prop.hitFlash = Math.max(0, prop.hitFlash - 1);
    }

    // ---- pickups
    for (let i = game.pickups.length - 1; i >= 0; i--) {
      const pick = game.pickups[i];
      pick.ttl -= 1;
      pick.bob += 0.08;
      if (pick.ttl <= 0) {
        game.pickups.splice(i, 1);
        continue;
      }
      const dx = Math.abs(pick.x - p.x);
      const dz = Math.abs(pick.z - p.z);
      if (dx < 16 && dz < 12 && !p.dead) {
        game.collectPickup(pick);
        game.pickups.splice(i, 1);
      }
    }
  };

  // Player movement is limited to the visible arena; the camera pushes forward
  // when the player walks into the deadzone.
  S.arena = function (game) {
    const st = FD.cfg.stage;
    const cam = game.camera.x;
    return {
      minX: Math.max(6, cam + 12),
      maxX: Math.min(st.worldWidth - 6, cam + FD.VIEW_W - 12),
      minZ: st.laneMin,
      maxZ: st.laneMax,
    };
  };

  S.hitProp = function (game, prop, damage, dir) {
    if (prop.broken) return;
    prop.hp -= damage;
    prop.hitFlash = 8;
    game.shake = Math.max(game.shake, 1.8);
    game.hitstop = Math.max(game.hitstop, 2);
    FD.sfx('punch', { volume: 0.5, rate: 0.7 });
    game.addEffect({
      type: 'debris', x: prop.x, y: prop.z - prop.h / 2, t: 0, life: 22,
      color: prop.type === 'barrel' ? '#6a7a8c' : prop.type === 'trash' ? '#5a6272' : '#7a5230',
      dir,
    });
    if (prop.hp <= 0) {
      prop.broken = true;
      if (game.stats) game.stats.propsBroken += 1;
      game.shake = Math.max(game.shake, 3.2);
      FD.sfx('break');
      const dropCfg = FD.cfg.stage.pickups[prop.drop];
      if (dropCfg) {
        game.pickups.push({
          type: prop.drop, x: prop.x, z: prop.z, ttl: dropCfg.ttl, bob: Math.random() * 6,
          label: dropCfg.label,
        });
      }
      game.addEffect({ type: 'break', x: prop.x, y: prop.z - prop.h / 2, t: 0, life: 26, dir });
    }
  };

  S.collectPickup = function (game, pick) {
    const def = FD.cfg.stage.pickups[pick.type];
    if (!def) return;
    if (pick.type === 'health') {
      game.player.health = Math.min(game.player.maxHealth, game.player.health + def.heal);
      game.addEffect({ type: 'heal', x: pick.x, y: pick.z - 50, t: 0, life: 34 });
      game.addScore(50);
    } else {
      game.addScore(def.points);
    }
    FD.sfx('pickup');
    game.addEffect({
      type: 'text', x: pick.x, y: pick.z - 64, t: 0, life: 46,
      text: pick.type === 'health' ? `+${def.heal} HP` : `+${def.points}`, color: 'green',
    });
  };

  FD.Stage = S;
})();

</script>
<script>
/* ---- src/render.js ---- */
// Canvas renderer: parallax city, rain, depth-sorted actors, effects and HUD.
(function () {
  'use strict';
  const FD = window.FD;
  const R = {};

  const LAYERS = [
    { name: 'sky', parallax: 0, tile: false },
    { name: 'far', parallax: 0.15, tile: true },
    { name: 'mid', parallax: 0.45, tile: true },
    { name: 'near', parallax: 1.0, tile: false },
    { name: 'fg', parallax: 1.18, tile: true },
  ];

  const tintCache = new Map();

  function tinted(img, color) {
    const key = img.src + '|' + color;
    if (tintCache.has(key)) return tintCache.get(key);
    const cv = document.createElement('canvas');
    cv.width = img.width;
    cv.height = img.height;
    const c = cv.getContext('2d');
    c.drawImage(img, 0, 0);
    c.globalCompositeOperation = 'source-atop';
    c.fillStyle = color;
    c.fillRect(0, 0, cv.width, cv.height);
    tintCache.set(key, cv);
    const white = document.createElement('canvas');
    white.width = img.width;
    white.height = img.height;
    const wc = white.getContext('2d');
    wc.drawImage(img, 0, 0);
    wc.globalCompositeOperation = 'source-in';
    wc.fillStyle = color;
    wc.fillRect(0, 0, white.width, white.height);
    tintCache.set(key + '|silhouette', white);
    return cv;
  }

  function silhouette(img, color) {
    tinted(img, color);
    return tintCache.get(img.src + '|' + color + '|silhouette');
  }

  R.init = function (game) {
    const data = FD.assets.data();
    game.film = data.stage;
    game.rain = [];
    const cfg = FD.cfg.presentation.weather;
    for (let i = 0; i < cfg.rainDrops; i++) {
      game.rain.push({
        x: Math.random() * (FD.VIEW_W + 80) - 40,
        y: Math.random() * FD.VIEW_H,
        len: 3 + Math.random() * 7,
        speed: cfg.rainSpeed * (0.7 + Math.random() * 0.7),
        splash: 0,
      });
    }
    game.splashes = [];
    game.lightning = { next: cfg.lightningMinTicks + Math.random() * (cfg.lightningMaxTicks - cfg.lightningMinTicks), flash: 0 };
    game.scanPattern = null;
    const scan = FD.assets.img('ui/scanline.png');
    if (scan) game.scanPattern = game.ctx.createPattern(scan, 'repeat');
    game.vignette = null;
  };

  R.updateWeather = function (game) {
    const w = FD.cfg.presentation.weather;
    const drops = game.rain;
    for (const d of drops) {
      d.y += d.speed;
      d.x += d.speed * w.rainAngle;
      if (d.y > FD.VIEW_H + 8) {
        d.y = -8 - Math.random() * 40;
        d.x = Math.random() * (FD.VIEW_W + 80) - 40;
        if (Math.random() < w.splashChance) {
          game.splashes.push({ x: d.x, y: FD.VIEW_H - 6 - Math.random() * 16, t: 0, life: 8 });
        }
      }
      if (d.x < -45) d.x += FD.VIEW_W + 90;
      if (d.x > FD.VIEW_W + 45) d.x -= FD.VIEW_W + 90;
    }
    for (let i = game.splashes.length - 1; i >= 0; i--) {
      const s = game.splashes[i];
      s.t += 1;
      if (s.t > s.life) game.splashes.splice(i, 1);
    }
    const lg = game.lightning;
    lg.next -= 1;
    if (lg.next <= 0) {
      lg.flash = 12;
      lg.next = w.lightningMinTicks + Math.random() * (w.lightningMaxTicks - w.lightningMinTicks);
      FD.sfx('break', { volume: 0.18, rate: 0.5 });
    }
    if (lg.flash > 0) lg.flash -= 1;
  };

  // ------------------------------------------------------------------ world
  function drawBackdrop(game, ctx) {
    const cam = game.camera.x;
    for (const layer of LAYERS) {
      const img = FD.assets.img(`stage/layers/${layer.name}.png`);
      if (!img) continue;
      if (layer.name === 'sky') {
        ctx.drawImage(img, 0, 0);
        continue;
      }
      if (layer.name === 'near') {
        ctx.drawImage(img, Math.round(cam), 0, FD.VIEW_W, FD.VIEW_H, 0, 0, FD.VIEW_W, FD.VIEW_H);
        continue;
      }
      const off = ((cam * layer.parallax) % img.width + img.width) % img.width;
      const x0 = -Math.round(off);
      for (let x = x0; x < FD.VIEW_W; x += img.width) {
        ctx.drawImage(img, x, 0);
      }
    }
    // sodium lamp pools on the sidewalk (additive)
    const pool = FD.assets.img('stage/props/light_pool.png');
    if (pool) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (const lx of [240, 700, 1160, 1620]) {
        const sx = lx - cam;
        if (sx < -60 || sx > FD.VIEW_W + 60) continue;
        const flicker = 0.55 + 0.06 * Math.sin(game.tick * 0.11 + lx);
        ctx.globalAlpha = flicker * 0.5;
        ctx.drawImage(pool, sx - 48, 168, 96, 96);
      }
      ctx.restore();
    }
    // Per-stage colour wash. Painted behind the actors, so silhouettes keep
    // their contrast while each stage reads as a different time of night.
    const theme = FD.cfg.stage.theme;
    if (theme) {
      ctx.save();
      ctx.fillStyle = theme;
      ctx.fillRect(0, 0, FD.VIEW_W, FD.VIEW_H);
      ctx.restore();
    }
  }

  function drawRain(game, ctx) {
    const w = FD.cfg.presentation.weather;
    ctx.save();
    ctx.strokeStyle = 'rgba(150,190,230,0.30)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (const d of game.rain) {
      const dx = d.len * w.rainAngle;
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x + dx, d.y + d.len);
    }
    ctx.stroke();
    ctx.fillStyle = 'rgba(170,210,240,0.45)';
    for (const s of game.splashes) {
      const a = 1 - s.t / s.life;
      ctx.globalAlpha = a * 0.7;
      ctx.fillRect(Math.round(s.x), Math.round(s.y), 2, 1);
    }
    ctx.restore();
    if (game.lightning.flash > 0) {
      const a = (game.lightning.flash / 12) * 0.35;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = `rgba(180,200,255,${a})`;
      ctx.fillRect(0, 0, FD.VIEW_W, FD.VIEW_H);
      ctx.restore();
    }
  }

  function drawShadow(ctx, actor) {
    const baseY = actor.z + 1;
    const scale = 1 - (actor.yOffset || 0) / 90;
    const w = 22 * Math.max(0.4, scale);
    ctx.save();
    ctx.globalAlpha = actor.state === 'defeated' ? 0.14 : 0.32 * Math.max(0.4, scale);
    ctx.fillStyle = '#05060c';
    ctx.beginPath();
    ctx.ellipse(actor.x - gameCamX + 0, baseY, w, 4.2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  let gameCamX = 0;

  function drawActor(game, ctx, actor) {
    const cfg = FD.characterCfg(actor.charId);
    if (!cfg) return;
    const animDef = cfg.animations[actor.anim];
    if (!animDef) return;
    const frame = Math.min(actor.frame, animDef.frames.length - 1);
    const sheet = actor.sheet || actor.charId;
    const rel = `characters/${sheet}/frames/${actor.anim}/${actor.anim}_${String(frame).padStart(2, '0')}.png`;
    const img = FD.assets.img(rel);
    if (!img) return;
    const ax = cfg.frame.anchorX;
    const ay = cfg.frame.anchorY;
    const sx = Math.round(actor.x - gameCamX - ax);
    const sy = Math.round(actor.z - ay - (actor.yOffset || 0));
    const scale = actor.drawScale && actor.drawScale !== 1 ? actor.drawScale : 1;
    ctx.save();
    if (actor.alpha !== undefined && actor.alpha < 1) ctx.globalAlpha = actor.alpha;
    if (scale !== 1 || actor.facing < 0) {
      // Scale and flip around the frame anchor so the feet stay planted.
      ctx.translate(actor.x - gameCamX, actor.z - (actor.yOffset || 0));
      ctx.scale(scale * (actor.facing < 0 ? -1 : 1), scale);
      ctx.drawImage(img, -ax, -ay);
    } else {
      ctx.drawImage(img, sx, sy);
    }
    ctx.restore();
    const flashColor = actor.flash > 0 ? (actor.kind === 'player' ? '#ffffff' : '#ffd9d0') : null;
    const isElite = actor.type === 'rivet_elite';
    if (flashColor || isElite) {
      const sil = silhouette(img, flashColor || '#ff8a6a');
      if (sil) {
        ctx.save();
        // Two-stage hit flash: two bright ticks on contact, then a faint tint
        // for the rest of the flinch. A constant bright overlay erased the
        // sprite silhouette for 6 ticks, which looked like a rendering bug.
        ctx.globalAlpha = flashColor ? (actor.flash >= 5 ? 0.55 : 0.16) : 0.24;
        if (actor.alpha !== undefined && actor.alpha < 1) ctx.globalAlpha *= actor.alpha;
        if (scale !== 1 || actor.facing < 0) {
          ctx.translate(actor.x - gameCamX, actor.z - (actor.yOffset || 0));
          ctx.scale(scale * (actor.facing < 0 ? -1 : 1), scale);
          ctx.drawImage(sil, -ax, -ay);
        } else {
          ctx.drawImage(sil, sx, sy);
        }
        ctx.restore();
      }
    }
    if (FD.cfg.presentation.debug.showHitboxes) {
      drawHitboxes(game, ctx, actor);
    }
  }

  function drawHitboxes(game, ctx, actor) {
    const A = FD.Actors;
    const hb = A.hurtBoxFor(actor);
    ctx.save();
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(90,255,140,0.8)';
    ctx.strokeRect(hb.x - gameCamX, hb.y, hb.w, hb.h);
    const hit = A.currentFrame(actor) && A.currentFrame(actor).hit;
    if (hit) {
      const box = A.hitBoxFor(actor, hit, 3);
      ctx.strokeStyle = 'rgba(255,90,90,0.9)';
      ctx.strokeRect(box.x - gameCamX, box.y, box.w, box.h);
    }
    ctx.restore();
  }

  function drawEffects(game, ctx, front) {
    for (const fx of game.effects) {
      const t = fx.t / fx.life;
      const sx = fx.x - gameCamX;
      if (front === false && fx.type === 'spawn') continue;
      ctx.save();
      if (fx.type === 'hit') {
        const a = 1 - t;
        ctx.globalAlpha = a;
        ctx.strokeStyle = fx.color || '#ffffff';
        ctx.lineWidth = 2;
        const r = 8 + t * 16;
        for (let i = 0; i < 6; i++) {
          const ang = (i / 6) * Math.PI * 2 + fx.dir * 0.4;
          ctx.beginPath();
          ctx.moveTo(sx + Math.cos(ang) * 4, fx.y + Math.sin(ang) * 4);
          ctx.lineTo(sx + Math.cos(ang) * r, fx.y + Math.sin(ang) * r);
          ctx.stroke();
        }
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = fx.color || '#ffffff';
        ctx.globalAlpha = a * 0.8;
        ctx.beginPath();
        ctx.arc(sx, fx.y, 3 + t * 6, 0, Math.PI * 2);
        ctx.fill();
      } else if (fx.type === 'damage' || fx.type === 'text') {
        const rise = FD.ease.outCubic(Math.min(1, t * 1.4)) * 18;
        FD.font.draw(ctx, fx.text, sx, fx.y - rise, {
          color: fx.color || 'cyan', align: 'center', scale: 1,
          alpha: 1 - Math.max(0, t - 0.6) / 0.4,
        });
      } else if (fx.type === 'ko') {
        FD.font.draw(ctx, 'K.O.', sx, fx.y - t * 10, {
          color: 'amber', align: 'center', scale: 2, alpha: 1 - Math.max(0, t - 0.5) / 0.5,
        });
      } else if (fx.type === 'shockwave') {
        ctx.globalCompositeOperation = 'lighter';
        const r = 10 + FD.ease.outCubic(t) * 66;
        ctx.strokeStyle = `rgba(99,247,255,${0.8 * (1 - t)})`;
        ctx.lineWidth = 3 * (1 - t) + 1;
        ctx.beginPath();
        ctx.ellipse(sx, fx.y, r, r * 0.42, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.strokeStyle = `rgba(255,255,255,${0.5 * (1 - t)})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(sx, fx.y, r * 0.72, r * 0.3, 0, 0, Math.PI * 2);
        ctx.stroke();
      } else if (fx.type === 'dust') {
        ctx.globalAlpha = 1 - t;
        ctx.fillStyle = '#8e93a8';
        for (let i = 0; i < 5; i++) {
          const dir = i < 2 ? -1 : 1;
          const px = sx + dir * (4 + t * 14 + i * 2);
          const py = fx.y - t * 8 - (i % 2) * 3;
          ctx.fillRect(Math.round(px), Math.round(py), 2, 2);
        }
      } else if (fx.type === 'debris' || fx.type === 'break') {
        ctx.globalAlpha = 1 - t;
        ctx.fillStyle = fx.color || '#7a5230';
        for (let i = 0; i < 9; i++) {
          const ang = (i / 9) * Math.PI * 2;
          const r = t * (fx.type === 'break' ? 26 : 14);
          ctx.fillRect(Math.round(sx + Math.cos(ang) * r), Math.round(fx.y + Math.sin(ang) * r * 0.7 + t * t * 16), 2, 2);
        }
      } else if (fx.type === 'spawn') {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = (1 - t) * 0.7;
        ctx.fillStyle = '#ff6a4a';
        ctx.beginPath();
        ctx.ellipse(sx, fx.y, 12 + t * 18, 4 + t * 6, 0, 0, Math.PI * 2);
        ctx.fill();
      } else if (fx.type === 'heal') {
        ctx.globalAlpha = 1 - t;
        FD.font.draw(ctx, 'CHARGE', sx, fx.y - t * 24, { color: 'green', align: 'center', alpha: 1 - t });
      } else if (fx.type === 'block') {
        ctx.globalAlpha = 1 - t;
        ctx.strokeStyle = '#9ff6ff';
        ctx.strokeRect(sx - 10, fx.y - 6, 20, 12);
      }
      ctx.restore();
    }
  }

  // ------------------------------------------------------------------ HUD
  function drawBar(ctx, x, y, w, h, ratio, color, bg = '#101826') {
    ctx.fillStyle = bg;
    ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
    ctx.fillStyle = '#2a3348';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = color;
    ctx.fillRect(x, y, Math.round(w * FD.clamp(ratio, 0, 1)), h);
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.fillRect(x, y, Math.round(w * FD.clamp(ratio, 0, 1)), 1);
  }

  function drawHUD(game, ctx) {
    const p = game.player;
    const combat = FD.cfg.combat.player;
    // portrait + health
    const portrait = FD.assets.img('ui/portrait_frame.png');
    if (portrait) ctx.drawImage(portrait, 8, 8);
    const face = FD.assets.img('characters/volt/frames/idle/idle_00.png');
    if (face) {
      // crop the head (frame space around x=57 y=32) and scale it 2x into the badge
      ctx.save();
      ctx.beginPath();
      ctx.rect(11, 11, 28, 28);
      ctx.clip();
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(face, 43, 16, 28, 28, 11, 11, 28, 28);
      ctx.restore();
    }
    FD.font.draw(ctx, 'VOLT', 46, 9, { color: 'white', scale: 1 });
    const hpRatio = p.health / p.maxHealth;
    drawBar(ctx, 46, 20, 96, 5, hpRatio, hpRatio > 0.35 ? '#63f7ff' : '#ff5a52');
    drawBar(ctx, 46, 28, 84, 2, 1 - p.specialCooldown / combat.special.cooldownTicks, '#ffbe5c');
    FD.font.draw(ctx, 'HP', 148, 19, { color: 'dim', scale: 1 });
    // score + time
    FD.font.draw(ctx, 'SCORE', 424, 9, { color: 'dim', align: 'right' });
    FD.font.draw(ctx, FD.pad(game.score, 6), 424, 18, { color: 'white', align: 'right' });
    FD.font.draw(ctx, 'TIME', 424, 30, { color: 'dim', align: 'right' });
    FD.font.draw(ctx, FD.pad(Math.ceil(game.timerTicks / 60), 2), 424, 39, { color: 'amber', align: 'right' });
    // stage label
    FD.font.draw(ctx, FD.cfg.stage.title, 240, 9, { color: 'cyanDim', align: 'center', scale: 1 });

    // enemy health bars
    if (FD.cfg.presentation.ui.enemyHealthBars) {
      for (const e of game.enemies) {
        if (e.state === 'defeated' || e.health >= e.maxHealth) continue;
        const sx = e.x - gameCamX;
        if (sx < 0 || sx > FD.VIEW_W) continue;
        const y = e.z - 74;
        const barColor = e.boss ? '#ffd24a' : e.def && e.def.elite ? '#ff8a6a' : '#ff5cc4';
        drawBar(ctx, sx - 14, y, e.boss ? 40 : 28, e.boss ? 3 : 2, e.health / e.maxHealth, barColor);
      }
    }
    // combo
    if (game.combo.count > 1 && game.combo.timer > 0) {
      FD.font.draw(ctx, `${game.combo.count} HIT`, 12, 232, { color: 'amber', scale: 2 });
      FD.font.draw(ctx, 'COMBO', 12, 250, { color: 'dim' });
    }
    // banners
    if (game.stageState && game.stageState.bannerTicks > 0) {
      const tt = 120 - game.stageState.bannerTicks;
      const alpha = FD.clamp(Math.min(tt / 12, game.stageState.bannerTicks / 24), 0, 1);
      if (game.stageState.banner) {
        FD.font.draw(ctx, game.stageState.banner, 240, 112, {
          color: 'amber', scale: 2, align: 'center', alpha,
        });
      }
    }
  }

  function drawVignette(game, ctx) {
    if (!FD.cfg.presentation.render.vignette) return;
    if (!game.vignette) {
      const g = ctx.createRadialGradient(240, 135, 90, 240, 135, 300);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(2,4,10,0.55)');
      game.vignette = g;
    }
    ctx.fillStyle = game.vignette;
    ctx.fillRect(0, 0, FD.VIEW_W, FD.VIEW_H);
    if (FD.cfg.presentation.render.scanlines && game.scanPattern) {
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = game.scanPattern;
      ctx.fillRect(0, 0, FD.VIEW_W, FD.VIEW_H);
      ctx.restore();
    }
  }

  // ------------------------------------------------------------------ frame
  R.draw = function (game) {
    const ctx = game.ctx;
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, FD.VIEW_W, FD.VIEW_H);
    gameCamX = game.camera.x;

    const shake = game.shake;
    const sx = shake > 0.1 ? (Math.random() * 2 - 1) * shake : 0;
    const sy = shake > 0.1 ? (Math.random() * 2 - 1) * shake * 0.7 : 0;
    ctx.save();
    ctx.translate(Math.round(sx), Math.round(sy));
    drawBackdrop(game, ctx);

    // drawable list sorted by depth (feet y), props included
    const drawables = [];
    for (const prop of game.props) {
      if (prop.broken) continue;
      drawables.push({ z: prop.z, kind: 'prop', ref: prop });
    }
    for (const pick of game.pickups) {
      drawables.push({ z: pick.z, kind: 'pickup', ref: pick });
    }
    if (!game.player.hidden && game.player.state !== 'dead') {
      drawables.push({ z: game.player.z, kind: 'actor', ref: game.player });
    } else if (game.player.state === 'dead') {
      drawables.push({ z: game.player.z, kind: 'actor', ref: game.player });
    }
    for (const e of game.enemies) drawables.push({ z: e.z, kind: 'actor', ref: e });
    drawables.sort((a, b) => a.z - b.z);

    for (const d of drawables) {
      if (d.kind === 'actor') {
        drawShadow(ctx, d.ref);
      }
    }
    for (const d of drawables) {
      if (d.kind === 'prop') {
        const prop = d.ref;
        const meta = FD.assets.dataRef ? null : null;
        const frames = { crate: 2, barrel: 2, trash: 2 }[prop.type] || 1;
        const stageIdx = prop.hp <= prop.maxHp / 2 && frames > 1 ? 1 : 0;
        const img = FD.assets.img(`stage/props/${prop.type}_${stageIdx}.png`);
        if (img) {
          const x = Math.round(prop.x - gameCamX - prop.w / 2);
          const y = Math.round(prop.z - prop.h);
          if (prop.hitFlash > 0) {
            ctx.save();
            ctx.globalAlpha = 0.9;
            ctx.drawImage(img, x, y);
            const sil = silhouette(img, '#ffffff');
            if (sil) {
              ctx.globalAlpha = 0.7;
              ctx.drawImage(sil, x, y);
            }
