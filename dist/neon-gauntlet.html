            ctx.restore();
          } else {
            ctx.drawImage(img, x, y);
          }
          if (FD.cfg.presentation.debug.showHitboxes) {
            const b = prop.box();
            ctx.strokeStyle = 'rgba(255,200,80,0.9)';
            ctx.strokeRect(b.x - gameCamX, b.y, b.w, b.h);
          }
        }
      } else if (d.kind === 'pickup') {
        const pick = d.ref;
        const img = FD.assets.img(`stage/props/pickup_${pick.type}.png`);
        if (img) {
          const bob = Math.sin(pick.bob) * 2;
          const blink = pick.ttl < 120 && Math.floor(pick.ttl / 6) % 2 === 0;
          if (!blink) {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.globalAlpha = 0.28 + Math.sin(pick.bob * 1.3) * 0.08;
            ctx.fillStyle = pick.type === 'health' ? '#63f7ff' : '#ffbe5c';
            ctx.beginPath();
            ctx.arc(pick.x - gameCamX, pick.z - 14 + bob, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            ctx.drawImage(img, Math.round(pick.x - gameCamX - 9), Math.round(pick.z - 22 + bob));
          }
        }
      } else {
        drawActor(game, ctx, d.ref);
      }
    }

    drawEffects(game, ctx, true);
    ctx.restore();

    drawRain(game, ctx);
    drawVignette(game, ctx);

    // HUD is drawn without shake so text stays readable
    if (game.state === 'playing' || game.state === 'paused' || game.state === 'stageclear') {
      drawHUD(game, ctx);
    }

    if (game.hitstop > 0 && FD.cfg.presentation.render.flashAlpha > 0) {
      // subtle white frame on impact
      ctx.save();
      ctx.globalAlpha = 0.06;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, FD.VIEW_W, FD.VIEW_H);
      ctx.restore();
    }

    game.shake *= FD.cfg.presentation.render.screenShakeDecay;
    if (game.shake < 0.08) game.shake = 0;
  };

  FD.Renderer = R;
})();

</script>
<script>
/* ---- src/cinematic.js ---- */
// 12 second intro cinematic, drawn with the same canvas code in-game and in
// the offline MP4 renderer.  Everything is a pure function of time `t`.
(function () {
  'use strict';
  const FD = window.FD;
  const W = FD.VIEW_W;
  const H = FD.VIEW_H;

  const DURATION = 12.0;
  const LETTERBOX = 26;

  function hash(n) {
    const s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return s - Math.floor(s);
  }

  function rainLayer(ctx, t, count, speed, alpha, slant) {
    ctx.save();
    ctx.strokeStyle = `rgba(168,196,230,${alpha})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < count; i++) {
      const x0 = hash(i * 3.1) * (W + 60) - 30;
      const speedI = speed * (0.6 + hash(i * 7.7) * 0.8);
      const y0 = (hash(i * 5.3) * H + t * speedI * 60) % (H + 20) - 10;
      const len = 4 + hash(i * 9.1) * 8;
      ctx.moveTo(x0 + (y0 / H) * slant, y0);
      ctx.lineTo(x0 + (y0 / H) * slant + slant * 0.08, y0 + len);
    }
    ctx.stroke();
    ctx.restore();
  }

  function layer(ctx, name, camX, parallax, yOff = 0) {
    const img = FD.assets.img(`stage/layers/${name}.png`);
    if (!img) return;
    if (name === 'sky') {
      ctx.drawImage(img, 0, 0);
      return;
    }
    if (name === 'near') {
      const sx = FD.clamp(camX, 0, img.width - W);
      ctx.drawImage(img, sx, 0, W, H, 0, yOff, W, H);
      return;
    }
    const off = ((camX * parallax) % img.width + img.width) % img.width;
    for (let x = -off; x < W; x += img.width) ctx.drawImage(img, x, yOff);
  }

  function sprite(ctx, charId, anim, frame, x, y, scale = 1, opts = {}) {
    const cfg = FD.characterCfg ? FD.characterCfg(charId) : FD.cfg.animation.characters[charId];
    if (!cfg) return;
    const def = cfg.animations[anim];
    if (!def) return;
    const f = FD.clamp(frame, 0, def.frames.length - 1);
    const img = FD.assets.img(
      `characters/${charId}/frames/${anim}/${anim}_${String(f).padStart(2, '0')}.png`
    );
    if (!img) return;
    const ax = cfg.frame.anchorX;
    const ay = cfg.frame.anchorY;
    ctx.save();
    ctx.translate(x, y);
    if (opts.facing === -1) ctx.scale(-1, 1);
    if (opts.scaleX && opts.scaleX !== 1) ctx.scale(opts.scaleX, 1);
    if (opts.alpha !== undefined) ctx.globalAlpha = opts.alpha;
    if (opts.tint) {
      ctx.drawImage(img, -ax * scale, -ay * scale, img.width * scale, img.height * scale);
      ctx.globalCompositeOperation = 'source-atop';
    }
    ctx.drawImage(img, -ax * scale, -ay * scale, img.width * scale, img.height * scale);
    ctx.restore();
  }

  function flicker(t, seed, rate = 7) {
    const v = Math.sin(t * rate + seed) * Math.sin(t * rate * 2.7 + seed * 3.1);
    return v > -0.2 ? 1 : 0.25;
  }

  function letterbox(ctx, alpha = 1) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#04050a';
    ctx.fillRect(0, 0, W, LETTERBOX);
    ctx.fillRect(0, H - LETTERBOX, W, LETTERBOX);
    ctx.restore();
  }

  function subtitle(ctx, text, alpha, y = H - 17, color = 'steel') {
    FD.font.draw(ctx, text, W / 2, y, { align: 'center', color, alpha, scale: 1 });
  }

  // --------------------------------------------------------------- shot 1
  function shotCity(ctx, t) {
    const local = t;
    layer(ctx, 'sky', 0, 0);
    layer(ctx, 'far', local * 70, 0.15);
    layer(ctx, 'mid', local * 70, 0.45);
    layer(ctx, 'near', 240 + local * 26, 1.0);
    // street glow
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#101a30';
    ctx.fillRect(0, H - 40, W, 40);
    ctx.restore();
    rainLayer(ctx, t, 90, 7, 0.35, -14);
    // lightning at 1.55s and 2.3s
    const flash = t > 1.55 && t < 1.7 ? 0.5 * (1 - (t - 1.55) / 0.15) : t > 2.28 && t < 2.36 ? 0.3 : 0;
    if (flash > 0) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = `rgba(190,210,255,${flash})`;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    const fadeIn = FD.clamp(local / 0.6, 0, 1);
    ctx.save();
    ctx.globalAlpha = fadeIn * 0.75;
    ctx.fillStyle = '#04050a';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
    // title type
    const typeIn = FD.clamp((local - 0.9) / 0.8, 0, 1);
    if (typeIn > 0) {
      const spacing = Math.round(FD.lerp(10, 0, FD.ease.outCubic(typeIn)));
      FD.font.draw(ctx, 'RAIN DISTRICT', W / 2, 100, {
        align: 'center', color: 'white', scale: 2, alpha: typeIn, spacing,
      });
      const rule = FD.ease.outCubic(typeIn);
      ctx.save();
      ctx.fillStyle = '#63f7ff';
      ctx.globalAlpha = typeIn;
      ctx.fillRect(W / 2 - 90 * rule, 122, 180 * rule, 1);
      ctx.restore();
      FD.font.draw(ctx, 'BLOCK 07  /  23:48', W / 2, 130, {
        align: 'center', color: 'cyanDim', alpha: typeIn * 0.9,
      });
    }
  }

  // --------------------------------------------------------------- shot 2
  function shotWalk(ctx, t) {
    // ground-level tracking shot: camera slides right with VOLT
    const local = t;
    const cam = 820 + local * 46;
    layer(ctx, 'sky', 0, 0);
    ctx.save();
    ctx.globalAlpha = 0.9;
    layer(ctx, 'mid', cam, 0.45);
    ctx.restore();
    layer(ctx, 'near', cam, 1.0);
    ctx.save();
    ctx.fillStyle = 'rgba(5,8,20,0.55)';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
    // neon sign flicker over the street
    const signOn = flicker(local, 2.1, 9);
    ctx.save();
    ctx.globalAlpha = 0.55 * signOn;
    ctx.fillStyle = '#ff5cc4';
    ctx.fillRect(332, 62, 54, 20);
    ctx.globalAlpha = 0.9 * signOn;
    ctx.fillStyle = '#1a0c16';
    FD.font.draw(ctx, 'RUSTLINE', 359, 68, { align: 'center', color: 'pink', scale: 1 });
    ctx.restore();
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.18 * signOn;
    ctx.fillStyle = '#ff5cc4';
    ctx.beginPath();
    ctx.ellipse(359, 74, 60, 22, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    rainLayer(ctx, t, 120, 8, 0.4, -16);

    // puddle reflection band
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#0a1424';
    ctx.fillRect(0, H - 52, W, 52);
    ctx.restore();

    // VOLT walks in from the left, lit by the neon behind him
    const walkPhase = (local * 6.5) % 6;
    const px = 168 + local * 30;
    const bob = Math.abs(Math.sin(local * 7.2)) * 1.5;
    const frame = Math.floor(walkPhase) % 6;
    // wet-ground reflection first
    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.translate(0, (H - 40) * 2);
    ctx.scale(1, -1);
    sprite(ctx, 'volt', 'walk', frame, px, H - 40 - bob, 2.1, { facing: 1 });
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = 0.95;
    sprite(ctx, 'volt', 'walk', frame, px, H - 46 - bob, 2.1, { facing: 1 });
    ctx.restore();
    // rim light pass
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.12;
    sprite(ctx, 'volt', 'walk', frame, px, H - 46 - bob, 2.1, { facing: 1 });
    ctx.restore();

    const a = FD.clamp((local - 0.4) / 0.6, 0, 1) * FD.clamp((2.55 - local) / 0.5, 0, 1);
    subtitle(ctx, 'THE RUSTLINE CREW OWNS THIS BLOCK', a);
  }

  // --------------------------------------------------------------- shot 3
  function shotGauntlet(ctx, t) {
    const local = t;
    // backdrop: out-of-focus neon wall
    layer(ctx, 'sky', 0, 0);
    ctx.save();
    ctx.filter = 'none';
    ctx.globalAlpha = 0.85;
    layer(ctx, 'mid', 520, 0.45);
    ctx.restore();
    ctx.save();
    ctx.fillStyle = 'rgba(4,8,18,0.72)';
    ctx.fillRect(0, 0, W, H);
    // teal light pool behind the character
    const g = ctx.createRadialGradient(W * 0.42, H * 0.42, 20, W * 0.42, H * 0.42, 180);
    g.addColorStop(0, 'rgba(40,180,200,0.35)');
    g.addColorStop(1, 'rgba(10,20,40,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
    rainLayer(ctx, t, 60, 6, 0.22, -10);

    // hero close-up: charge pose (special frames 0-2)
    const frame = FD.clamp(Math.floor(local * 6) % 4, 0, 3);
    const zoom = 3.15 + local * 0.12;
    const ox = 232 - local * 6;
    const oy = H - 16;
    ctx.save();
    ctx.globalAlpha = 0.4;
    sprite(ctx, 'volt', 'special', frame, ox + 4, oy + 4, zoom, { facing: 1 });
    ctx.restore();
    sprite(ctx, 'volt', 'special', frame, ox, oy, zoom, { facing: 1 });
    // reflection on the ground
    ctx.save();
    ctx.globalAlpha = 0.12;
    ctx.translate(0, (H - 22) * 2);
    ctx.scale(1, -1);
    sprite(ctx, 'volt', 'special', frame, ox, oy, zoom, { facing: 1 });
    ctx.restore();

    // electric arcs
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const arcSeed = Math.floor(local * 18);
    for (let k = 0; k < 5; k++) {
      const h1 = hash(arcSeed + k * 7);
      const h2 = hash(arcSeed * 3 + k * 11);
      const x0 = 236 + h1 * 54;
      const y0 = 40 + h2 * 64;
      ctx.strokeStyle = k % 2 ? 'rgba(150,250,255,0.9)' : 'rgba(255,255,255,0.8)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      let px = x0;
      let py = y0;
      for (let s2 = 0; s2 < 5; s2++) {
        px += (hash(arcSeed + s2 * 3.3 + k) - 0.5) * 30;
        py += (hash(arcSeed + s2 * 7.7 + k) - 0.5) * 26;
        ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    ctx.restore();

    const a = FD.clamp((local - 0.7) / 0.6, 0, 1) * FD.clamp((2.55 - local) / 0.5, 0, 1);
    FD.font.draw(ctx, 'VOLT', 352, 30, { color: 'white', scale: 3, alpha: a });
    FD.font.draw(ctx, 'ELECTRIC', 352, 60, { color: 'cyan', alpha: a });
    FD.font.draw(ctx, 'GAUNTLET', 352, 72, { color: 'cyan', alpha: a });
    subtitle(ctx, 'ONE SPARK IS ALL IT TAKES', a * 0.9);
  }

  // --------------------------------------------------------------- shot 4
  function shotStandoff(ctx, t) {
    const local = t;
    const cam = 1280 + local * 8;
    layer(ctx, 'sky', 0, 0);
    layer(ctx, 'far', cam, 0.15);
    layer(ctx, 'mid', cam, 0.45);
    layer(ctx, 'near', cam, 1.0);
    ctx.save();
    ctx.fillStyle = 'rgba(4,6,16,0.5)';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
    rainLayer(ctx, t, 140, 9, 0.42, -18);

    // three goons step out of the rain, kept as dark silhouettes
    const adv = FD.clamp(local / 2.0, 0, 1);
    const walkFrame = Math.floor(local * 7) % 6;
    const positions = [
      { x: 296 + (1 - adv) * 80, z: H - 34, s: 1.45 },
      { x: 336 + (1 - adv) * 110, z: H - 30, s: 1.58 },
      { x: 382 + (1 - adv) * 140, z: H - 36, s: 1.4 },
    ];
    positions.forEach((pos, i) => {
      ctx.save();
      ctx.globalAlpha = 0.38 + 0.22 * adv;
      ctx.filter = 'brightness(0.4) saturate(0.55)';
      sprite(ctx, 'rivet', 'walk', (walkFrame + i) % 6, pos.x, pos.z, pos.s, { facing: -1 });
      ctx.restore();
    });
    // red visor glow on the middle goon
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = `rgba(255,90,60,${0.75 * adv})`;
    ctx.fillRect(positions[1].x - 20, positions[1].z - 62, 3, 2);
    ctx.fillRect(positions[1].x - 14, positions[1].z - 62, 3, 2);
    ctx.restore();

    // wet street band that the title sits on
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = '#04050a';
    ctx.fillRect(0, 148, W, 58);
    ctx.fillStyle = '#63f7ff';
    ctx.fillRect(0, 148, W, 1);
    ctx.fillRect(0, 205, W, 1);
    ctx.restore();

    // title slams in, left aligned so the hero can stand in front of the plate
    const slamT = FD.clamp((local - 0.9) / 0.55, 0, 1);
    if (slamT > 0) {
      const scale = FD.lerp(4.4, 2, FD.ease.outBack(slamT));
      const alpha = slamT;
      FD.font.draw(ctx, 'NEON', 176, 156, { color: 'white', scale, alpha });
      FD.font.draw(ctx, 'GAUNTLET', 176, 178, { color: 'cyan', scale, alpha });
      FD.font.draw(ctx, 'A TRIBUTE TO STREETS OF RAGE', 178, 199, {
        align: 'left', color: 'cyanDim', alpha: alpha * 0.9,
      });
    }

    // VOLT in the foreground, back to the goons, gauntlet already sparking
    const heroFrame = local < 1.0 ? 1 : local < 1.6 ? 2 : local < 2.3 ? 3 : 4;
    const heroX = 92;
    const heroY = H - 6;
    ctx.save();
    ctx.globalAlpha = 0.16;
    ctx.translate(0, heroY * 2);
    ctx.scale(1, -1);
    sprite(ctx, 'volt', 'special', heroFrame, heroX, heroY, 2.15, { facing: 1 });
    ctx.restore();
    sprite(ctx, 'volt', 'special', heroFrame, heroX, heroY, 2.15, { facing: 1 });
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.1 + 0.05 * Math.sin(local * 20);
    sprite(ctx, 'volt', 'special', heroFrame, heroX, heroY, 2.15, { facing: 1 });
    ctx.restore();
  }

  const SHOTS = [
    { start: 0.0, end: 3.0, draw: shotCity },
    { start: 3.0, end: 6.2, draw: shotWalk },
    { start: 6.2, end: 9.2, draw: shotGauntlet },
    { start: 9.2, end: 12.0, draw: shotStandoff },
  ];

  const Cinematic = {
    duration: DURATION,
    shots: SHOTS,
    draw(game, ctx, t) {
      ctx.save();
      ctx.imageSmoothingEnabled = false;
      ctx.fillStyle = '#04050a';
      ctx.fillRect(0, 0, W, H);
      const time = FD.clamp(t, 0, DURATION);
      let shot = SHOTS[SHOTS.length - 1];
      for (const s of SHOTS) {
        if (time >= s.start && time < s.end) {
          shot = s;
          break;
        }
      }
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, LETTERBOX, W, H - LETTERBOX * 2);
      ctx.clip();
      shot.draw(ctx, time - shot.start);
      ctx.restore();
      // dip-to-black transitions between shots (0.18s)
      for (const s of SHOTS) {
        const d = Math.abs(time - s.start);
        if (d < 0.18) {
          ctx.save();
          ctx.globalAlpha = 1 - d / 0.18;
          ctx.fillStyle = '#04050a';
          ctx.fillRect(0, 0, W, H);
          ctx.restore();
        }
      }
      // end fade
      if (time > DURATION - 0.5) {
        ctx.save();
        ctx.globalAlpha = (time - (DURATION - 0.5)) / 0.5;
        ctx.fillStyle = '#04050a';
        ctx.fillRect(0, 0, W, H);
        ctx.restore();
      }
      letterbox(ctx, 1);
      // skip hint only when played inside the game
      if (game && game.state === 'cinematic' && !FD.assets.filmMode) {
        FD.font.draw(ctx, 'ENTER TO SKIP', W - 8, H - 18, { align: 'right', color: 'dim', alpha: 0.7 });
      }
      ctx.restore();
    },
  };

  FD.Cinematic = Cinematic;
})();

</script>
<script>
/* ---- src/main.js ---- */
// Game shell: fixed-timestep loop, scene flow and the autopilot used for
// recorded footage.  The same class runs in the browser and in the Node
// capture harness (which drives step()/draw() directly).
(function () {
  'use strict';
  const FD = window.FD;

  class Game {
    constructor(canvas) {
      this.canvas = canvas;
      this.ctx = canvas.getContext('2d');
      this.width = FD.VIEW_W;
      this.height = FD.VIEW_H;
      this.state = 'boot';
      this.tick = 0;
      this.stateTicks = 0;
      this.score = 0;
      this.shake = 0;
      this.hitstop = 0;
      this.effects = [];
      this.ipan = 0;
      this.enemies = [];
      this.props = [];
      this.pickups = [];
      this.player = null;
      this.camera = { x: 0, locked: false };
      this.combo = { count: 0, timer: 0, playerHits: 0 };
      this.stats = { hits: 0, damageTaken: 0, enemiesDefeated: 0, propsBroken: 0 };
      this.debug = { invincible: false, showHitboxes: false };
      this.stageState = null;
      this.stageIndex = 0;
      this.stageClearNext = false;
      this.campaign = { cleared: 0, score: 0, hits: 0, damageTaken: 0 };
      this.timerTicks = 99 * 60;
      this.autopilot = false;
      this.autopilotPlan = { attackCooldown: 0, specialCooldown: 0, dirHold: 0, dir: 0 };
      this.gameoverTicks = 0;
      this.cinematicT = 0;
      this.results = null;
      this.running = false;
      this.acc = 0;
      this.lastTime = 0;
      this.onStateChange = null;
      this.audioKick = false;
    }

    setState(next) {
      const prev = this.state;
      this.state = next;
      this.stateTicks = 0;
      if (this.onStateChange) this.onStateChange(next, prev);
    }

    addScore(n) {
      this.score += n;
    }

    addEffect(fx) {
      fx.t = 0;
      this.effects.push(fx);
      if (this.effects.length > 240) this.effects.shift();
    }

    arena() {
      return FD.Stage.arena(this);
    }

    enemyArena() {
      const st = FD.cfg.stage;
      return {
        minX: Math.max(-40, this.camera.x - 80),
        maxX: Math.min(st.worldWidth + 40, this.camera.x + FD.VIEW_W + 80),
        minZ: st.laneMin,
        maxZ: st.laneMax,
      };
    }

    hitProp(prop, damage, dir) {
      FD.Stage.hitProp(this, prop, damage, dir);
    }

    collectPickup(pick) {
      FD.Stage.collectPickup(this, pick);
    }

    onPlayerLandedHit(def, enemy, isSpecial) {
      this.stats.hits += 1;
      this.combo.count += 1;
      this.combo.timer = 90;
      if (isSpecial) {
        this.shake = Math.max(this.shake, 4.5);
        for (const e of this.enemies) {
          if (Math.abs(e.x - this.player.x) < 90 && e.state !== 'defeated') {
            this.addEffect({ type: 'hit', x: e.x, y: e.z - 40, t: 0, life: 12, color: '#9ff6ff', dir: 1 });
          }
        }
      }
      this.player.flash = 0;
    }

    onPlayerDead() {
      this.gameoverTicks = 0;
    }

    onStageClear() {
      this.player.state = 'victory';
      FD.Actors.setAnim(this.player, 'victory');
      const stages = FD.stageList ? FD.stageList() : [];
      const total = Math.max(1, stages.length);
      const finalStage = this.stageIndex >= total - 1;
      this.campaign.cleared += 1;
      this.campaign.score = this.score;
      this.campaign.hits = this.stats.hits;
      this.campaign.damageTaken = this.stats.damageTaken;
      this.results = {
        score: this.score,
        timeLeft: Math.max(0, Math.ceil(this.timerTicks / 60)),
        hits: this.stats.hits,
        damageTaken: this.stats.damageTaken,
        cleared: true,
        stage: this.stageIndex + 1,
        stages: total,
        finalStage,
        campaign: { ...this.campaign },
      };
      this.stageClearNext = !finalStage;
      this.addEffect({ type: 'ko', x: this.player.x, y: this.player.z - 90, t: 0, life: 60 });
      this.setState('stageclear');
      FD.audio.duckMusic(false);
    }

    startStage(index) {
      if (typeof index === 'number') this.stageIndex = index;
      const list = FD.stageList ? FD.stageList() : [];
      if (list.length) this.stageIndex = FD.clamp(this.stageIndex, 0, list.length - 1);
      if (FD.setStage) FD.setStage(this.stageIndex);
      FD.Stage.init(this);
      FD.Renderer.init(this);
      this.setState('intro');
      FD.audio.duckMusic(true);
    }

    startTitle() {
      this.stageIndex = 0;
      this.stageClearNext = false;
      this.campaign = { cleared: 0, score: 0, hits: 0, damageTaken: 0 };
      this.results = null;
      if (FD.setStage) FD.setStage(0);
      FD.Stage.init(this);
      FD.Renderer.init(this);
      this.state = 'title';
      this.stateTicks = 0;
      this.score = 0;
      this.timerTicks = 99 * 60;
      this.combo = { count: 0, timer: 0, playerHits: 0 };
      this.stats = { hits: 0, damageTaken: 0, enemiesDefeated: 0, propsBroken: 0 };
      FD.audio.duckMusic(false);
    }

    // ---------------------------------------------------------------- update
    update() {
      this.stateTicks += 1;
      const input = FD.input;

      switch (this.state) {
        case 'title': {
          // slow attract pan
          this.camera.x = (Math.sin(this.stateTicks * 0.0032) * 0.5 + 0.5) * 120;
          this.tick += 1;
          this.updateAttractActors();
          FD.Renderer.updateWeather(this);
          if (input.wasPressed('start') || input.wasPressed('attack') || input.wasPressed('jump')) {
            FD.audio.unlock();
            FD.sfx('select');
            if (FD.Cinematic && !this.skipCinematic && !FD.assets.filmMode) {
              this.cinematicT = 0;
              this.setState('cinematic');
            } else {
              this.startStage();
            }
          }
          break;
        }
        case 'movie':
        case 'cinematic': {
          this.cinematicT += 1 / 60;
          FD.Renderer.updateWeather(this);
          if (this.cinematicT >= FD.Cinematic.duration || input.wasPressed('start') || input.wasPressed('attack')) {
            this.startStage();
          }
          break;
        }
        case 'intro': {
          this.tick += 1;
          this.player.hidden = false;
          FD.Renderer.updateWeather(this);
          if (this.stateTicks === 1) {
            FD.Actors.setAnim(this.player, 'walk');
          }
          if (this.stateTicks > 30 && this.stateTicks < 100) {
            this.player.x = FD.clamp(this.player.x + 0.6, 40, 260);
          }
          this.player.facing = 1;
          FD.Actors.advanceAnim(this.player);
          FD.Actors.advanceAnim(this.player);
          if (this.stateTicks > 170) {
            this.setState('playing');
            this.stageState.banner = 'GO';
            this.stageState.bannerTicks = 48;
          }
          break;
        }
        case 'playing': {
          this.updatePlay();
          break;
        }
        case 'paused': {
          if (input.wasPressed('pause') || input.wasPressed('start')) {
            this.setState('playing');
            FD.sfx('select');
          }
          break;
        }
        case 'stageclear': {
          this.tick += 1;
          FD.Actors.advanceAnim(this.player);
          FD.Renderer.updateWeather(this);
          this.updateEffects();
          if (this.stateTicks > 260) {
            if (this.stageClearNext) this.startStage(this.stageIndex + 1);
            else this.setState('results');
          }
          break;
        }
        case 'results': {
          FD.Renderer.updateWeather(this);
          this.tick += 1;
          if (input.wasPressed('start') || input.wasPressed('attack')) {
            FD.sfx('select');
            this.startTitle();
          }
          break;
        }
        case 'gameover': {
          this.gameoverTicks += 1;
          this.tick += 1;
          FD.Renderer.updateWeather(this);
          this.updateEffects();
          if (this.gameoverTicks > 90 && (input.wasPressed('start') || input.wasPressed('attack'))) {
            FD.sfx('select');
            this.startStage(this.stageIndex);
          }
          break;
        }
        default:
          break;
      }
      input.endTick();
    }

    updateAttractActors() {
      if (!this.player) return;
      const p = this.player;
      p.x = 205 + Math.sin(this.stateTicks * 0.01) * 6;
      p.z = 236;
      p.facing = 1;
      FD.Actors.advanceAnim(p);
      if (!this.enemies.length) {
        const e = FD.Actors.createEnemy(this, 'rivet', 340, 222, { side: 1 });
        e.state = 'idle';
        e.decisionTicks = 9999;
        e.alpha = 1;
        e.z = 222;
        this.enemies.push(e);
      }
      for (const e of this.enemies) {
        e.x = 336 + Math.sin(this.stateTicks * 0.012 + 1) * 5;
        e.facing = -1;
        FD.Actors.advanceAnim(e);
      }
    }

    updatePlay() {
      const input = FD.input;
      if (input.wasPressed('pause')) {
        this.setState('paused');
        FD.sfx('select');
        return;
      }
      if (input.wasPressed('mute')) {
        FD.audio.setMuted(!FD.audio.muted);
      }
      if (input.wasPressed('debug')) {
        this.debug.showHitboxes = !this.debug.showHitboxes;
      }
      if (this.autopilot) this.applyAutopilot();
      if (this.hitstop > 0) {
        this.hitstop -= 1;
        return;
      }
      this.tick += 1;
      this.timerTicks -= 1;
      if (this.combo.timer > 0) {
        this.combo.timer -= 1;
        if (this.combo.timer === 0) this.combo.count = 0;
      }

      FD.Actors.updatePlayer(this, this.player);
      for (const e of this.enemies) FD.Actors.updateEnemy(this, e);
      if (this.player.state === 'dead') {
        this.gameoverTicks += 1;
        if (this.gameoverTicks > 110) {
          this.results = {
            score: this.score, timeLeft: Math.max(0, Math.ceil(this.timerTicks / 60)),
            hits: this.stats.hits, damageTaken: this.stats.damageTaken, cleared: false,
          };
          this.setState('gameover');
          FD.audio.duckMusic(false);
          return;
        }
      } else {
        this.gameoverTicks = 0;
      }
      // player-enemy body separation
      for (const e of this.enemies) {
        if (e.state === 'defeated' || e.state === 'fall') continue;
        if (Math.abs(e.x - this.player.x) < 20 && Math.abs(e.z - this.player.z) < 10 &&
            this.player.state !== 'attack' && this.player.state !== 'special' && this.player.state !== 'jump_attack') {
          const dir = FD.sign(this.player.x - e.x) || 1;
          this.player.x = FD.clamp(this.player.x + dir * 0.4, this.arena().minX, this.arena().maxX);
        }
      }
      FD.Actors.resolveHits(this);
      FD.Stage.update(this);
      this.updateEffects();
      FD.Renderer.updateWeather(this);
      if (this.timerTicks <= 0 && this.player.state !== 'dead') {
        FD.Actors.playerTakeHit(this, this.player, 999, { dir: 1, knockdown: true });
      }
    }

    updateEffects() {
      for (let i = this.effects.length - 1; i >= 0; i--) {
        const fx = this.effects[i];
        fx.t += 1;
        if (fx.t >= fx.life) this.effects.splice(i, 1);
      }
    }

    // ---------------------------------------------------------------- autopilot
    applyAutopilot() {
      const input = FD.input;
      const p = this.player;
      const plan = this.autopilotPlan;
      for (const a of ['left', 'right', 'up', 'down', 'attack', 'jump', 'special']) input.release(a);
      if (plan.attackCooldown > 0) plan.attackCooldown -= 1;
      if (plan.specialCooldown > 0) plan.specialCooldown -= 1;
      if (!p || p.state === 'dead') return;
      const busy = ['attack', 'special', 'jump_attack', 'hurt', 'fall', 'getup', 'land', 'victory'].includes(p.state);
      if (busy) return;

      // 1) survival: grab a health pickup when hurt
      if (p.health < 70) {
        let bestPick = null;
        let bestD = 1e9;
        for (const pick of this.pickups) {
          if (pick.type !== 'health') continue;
          const d = Math.abs(pick.x - p.x);
          if (d < 180 && d < bestD) { bestD = d; bestPick = pick; }
        }
        if (bestPick && bestD > 12) {
          if (Math.abs(bestPick.z - p.z) > 4) input.press(bestPick.z > p.z ? 'down' : 'up');
          input.press(bestPick.x > p.x ? 'right' : 'left');
          return;
        }
      }

      // 2) pick a fight target
      let target = null;
      let best = 1e9;
      for (const e of this.enemies) {
        if (e.state === 'defeated' || e.state === 'fall' || e.state === 'spawn') continue;
        const d = Math.abs(e.x - p.x) + Math.abs(e.z - p.z) * 0.6;
        if (d < best) { best = d; target = e; }
      }
      if (!target) {
        // 3) smash a crate that is right in front of us (but do not fixate)
        for (const prop of this.props) {
          if (prop.broken) continue;
          if ((prop.ignoredUntil || 0) > this.tick) continue;
          const d = Math.abs(prop.x - p.x);
          if (d < 52 && Math.abs(prop.z - p.z) < 10) {
            target = { x: prop.x, z: prop.z, prop };
            break;
          }
        }
      }
      if (!target) {
        input.press('right');
        return;
      }
      const dx = target.x - p.x;
      const dz = target.z - p.z;
      if (Math.abs(dz) > 4) input.press(dz > 0 ? 'down' : 'up');
      if (Math.abs(dx) > 36) {
        input.press(dx > 0 ? 'right' : 'left');
        return;
      }
      // in range: face the target and swing
      p.facing = dx >= 0 ? 1 : -1;
      if (Math.abs(dz) <= 12 && plan.attackCooldown <= 0) {
        input.press('attack');
        plan.attackCooldown = 6 + Math.floor(Math.random() * 4);
        if (target.prop) {
          target.prop.autopilotHits = (target.prop.autopilotHits || 0) + 1;
          if (target.prop.autopilotHits > 6) target.prop.ignoredUntil = this.tick + 240;
        }
      }
      const alive = this.enemies.filter((e) => e.state !== 'defeated' && e.state !== 'fall');
      if (alive.length >= 2 && plan.specialCooldown <= 0 && p.health > 50 && Math.random() < 0.025) {
        input.press('special');
        plan.specialCooldown = 120;
      }
    }

    // ---------------------------------------------------------------- render
    draw() {
      const ctx = this.ctx;
      ctx.imageSmoothingEnabled = false;
      switch (this.state) {
        case 'boot':
          ctx.fillStyle = '#05060c';
          ctx.fillRect(0, 0, FD.VIEW_W, FD.VIEW_H);
          FD.font.draw(ctx, 'LOADING', 240, 128, { align: 'center', color: 'cyan' });
          break;
        case 'title':
          this.drawTitle(ctx);
          break;
        case 'movie':
        case 'cinematic':
          FD.Cinematic.draw(this, ctx, this.cinematicT);
          break;
        case 'intro':
          FD.Renderer.draw(this);
          this.drawIntroOverlay(ctx);
          break;
        case 'playing':
          FD.Renderer.draw(this);
          break;
        case 'paused':
          FD.Renderer.draw(this);
          this.drawPauseOverlay(ctx);
          break;
        case 'stageclear':
          FD.Renderer.draw(this);
          this.drawStageClear(ctx);
          break;
        case 'results':
          this.drawResults(ctx);
          break;
        case 'gameover':
          FD.Renderer.draw(this);
          this.drawGameOver(ctx);
          break;
        default:
          break;
      }
    }

    drawTitle(ctx) {
      const cam = this.camera.x;
      this.camera.x = cam;
      FD.Renderer.draw(this);
      // darken for legibility
      ctx.fillStyle = 'rgba(4,6,14,0.45)';
      ctx.fillRect(0, 0, FD.VIEW_W, FD.VIEW_H);
      const logo = FD.assets.img('ui/logo.png');
      if (logo) {
        const bob = Math.sin(this.stateTicks * 0.04) * 2;
        ctx.drawImage(logo, 240 - logo.width / 2, 34 + bob);
      }
      const blink = Math.floor(this.stateTicks / 32) % 2 === 0;
      if (blink) {
        FD.font.draw(ctx, 'PRESS ENTER', 240, 156, { align: 'center', color: 'cyan', scale: 2 });
      }
      FD.font.draw(ctx, 'MOVE: ARROWS / WASD    ATTACK: J / Z    JUMP: K / X', 240, 194, {
        align: 'center', color: 'steel', scale: 1,
      });
      FD.font.draw(ctx, 'SPECIAL: L / C    PAUSE: ESC', 240, 206, { align: 'center', color: 'steel' });
      FD.font.draw(ctx, 'ORIGINAL BEAT \'EM UP  -  V1.0', 240, 250, { align: 'center', color: 'dim' });
      if (FD.Cinematic) {
        FD.font.draw(ctx, '12 SECOND INTRO MOVIE PLAYS ON START', 240, 226, { align: 'center', color: 'cyanDim' });
      }
    }

    drawIntroOverlay(ctx) {
      const t = this.stateTicks;
      if (t > 150) return;
      const fade = t < 20 ? t / 20 : t > 130 ? (150 - t) / 20 : 1;
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.fillStyle = '#05070f';
      ctx.fillRect(0, 150, FD.VIEW_W, 74);
      ctx.fillStyle = '#63f7ff';
      ctx.fillRect(0, 150, FD.VIEW_W, 1);
      ctx.fillRect(0, 223, FD.VIEW_W, 1);
      const total = Math.max(1, (FD.stageList ? FD.stageList().length : 1));
      FD.font.draw(ctx, `STAGE ${this.stageIndex + 1} / ${total}`, 240, 158, { align: 'center', color: 'amber', scale: 1 });
      FD.font.draw(ctx, FD.cfg.stage.title, 240, 172, { align: 'center', color: 'white', scale: 2 });
      FD.font.draw(ctx, FD.cfg.stage.subtitle, 240, 196, { align: 'center', color: 'cyanDim' });
      ctx.restore();
    }

    drawPauseOverlay(ctx) {
      ctx.save();
      ctx.fillStyle = 'rgba(4,6,14,0.62)';
      ctx.fillRect(0, 0, FD.VIEW_W, FD.VIEW_H);
      FD.font.draw(ctx, 'PAUSED', 240, 112, { align: 'center', color: 'cyan', scale: 3 });
      FD.font.draw(ctx, 'ESC TO RESUME', 240, 148, { align: 'center', color: 'steel' });
      FD.font.draw(ctx, 'ARROWS MOVE   J ATTACK   K JUMP   L SPECIAL', 240, 166, {
        align: 'center', color: 'dim',
      });
      ctx.restore();
    }

    drawStageClear(ctx) {
      const t = this.stateTicks;
      const a = FD.clamp(t / 30, 0, 1);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(4,6,14,0.5)';
      ctx.fillRect(0, 86, FD.VIEW_W, 74);
      const list = FD.stageList ? FD.stageList() : [];
      FD.font.draw(ctx, `STAGE ${this.stageIndex + 1} CLEAR`, 240, 100, { align: 'center', color: 'amber', scale: 3 });
      FD.font.draw(ctx, `SCORE ${FD.pad(this.score, 6)}`, 240, 134, { align: 'center', color: 'white', scale: 1 });
      if (this.stageClearNext && list[this.stageIndex + 1]) {
        FD.font.draw(ctx, `NEXT: ${list[this.stageIndex + 1].title}`, 240, 148, { align: 'center', color: 'cyanDim', scale: 1 });
      }
      ctx.restore();
    }

    drawResults(ctx) {
      ctx.fillStyle = '#070a12';
      ctx.fillRect(0, 0, FD.VIEW_W, FD.VIEW_H);
      // slow rain behind the panel
      FD.Renderer.updateWeather(this);
      ctx.save();
      ctx.globalAlpha = 0.25;
      const near = FD.assets.img('stage/layers/near.png');
      if (near) ctx.drawImage(near, 900, 0, FD.VIEW_W, FD.VIEW_H, 0, 0, FD.VIEW_W, FD.VIEW_H);
      ctx.restore();
      ctx.fillStyle = 'rgba(6,8,16,0.72)';
      ctx.fillRect(0, 0, FD.VIEW_W, FD.VIEW_H);
      FD.font.draw(ctx, 'RESULTS', 240, 30, { align: 'center', color: 'cyan', scale: 3 });
      const r = this.results || { score: 0, timeLeft: 0, hits: 0, cleared: false };
      const campaign = this.campaign || { cleared: 0, score: 0, hits: 0, damageTaken: 0 };
      const allClear = r.finalStage === true;
      FD.font.draw(ctx, allClear ? 'ALL STAGES CLEAR' : (r.cleared ? `STAGE ${r.stage || 1} CLEARED` : 'MISSION FAILED'), 240, 66, {
        align: 'center', color: r.cleared ? 'amber' : 'red', scale: 1,
      });
      const rows = [
        ['SCORE', FD.pad(campaign.score || r.score, 6)],
        ['STAGES CLEARED', `${campaign.cleared || 0} / ${r.stages || 1}`],
        ['HITS LANDED', FD.pad(campaign.hits || r.hits, 3)],
        ['DAMAGE TAKEN', FD.pad(campaign.damageTaken || 0, 3)],
      ];
      rows.forEach((row, i) => {
        const y = 96 + i * 18;
        FD.font.draw(ctx, row[0], 168, y, { color: 'steel' });
        FD.font.draw(ctx, row[1], 312, y, { color: 'white', align: 'right' });
      });
      FD.font.draw(ctx, 'THANKS FOR PLAYING', 240, 176, { align: 'center', color: 'dim' });
      if (Math.floor(this.stateTicks / 32) % 2 === 0) {
        FD.font.draw(ctx, 'PRESS ENTER', 240, 210, { align: 'center', color: 'cyan', scale: 2 });
      }
    }

    drawGameOver(ctx) {
      const t = this.gameoverTicks;
      const a = FD.clamp(t / 40, 0, 0.8);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = '#0a0406';
      ctx.fillRect(0, 0, FD.VIEW_W, FD.VIEW_H);
      ctx.restore();
      FD.font.draw(ctx, 'GAME OVER', 240, 110, { align: 'center', color: 'red', scale: 3 });
      FD.font.draw(ctx, `SCORE ${FD.pad(this.score, 6)}`, 240, 146, { align: 'center', color: 'white' });
      if (this.gameoverTicks > 90 && Math.floor(this.stateTicks / 32) % 2 === 0) {
        FD.font.draw(ctx, 'PRESS ENTER TO RETRY', 240, 178, { align: 'center', color: 'cyan' });
      }
    }

    // ---------------------------------------------------------------- loop
    frame(now) {
      if (!this.running) return;
      if (!this.lastTime) this.lastTime = now;
      let dt = (now - this.lastTime) / 1000;
      this.lastTime = now;
      if (dt > 0.25) dt = 0.25;
      this.acc += dt;
      const step = 1 / FD.TICK_HZ;
      let guard = 0;
      while (this.acc >= step && guard < 6) {
        this.update();
        this.acc -= step;
        guard += 1;
      }
      this.draw();
      requestAnimationFrame((t) => this.frame(t));
    }

    startLoop() {
      this.running = true;
      this.lastTime = 0;
      requestAnimationFrame((t) => this.frame(t));
    }

    // Headless helper: run exact ticks without rendering.
    step(n = 1) {
      for (let i = 0; i < n; i++) this.update();
    }

    drawFrame() {
      this.draw();
    }
  }

  FD.Game = Game;

  FD.createGame = function (canvas) {
    const game = new Game(canvas);
    game.debug.invincible = !!(FD.cfg.presentation && FD.cfg.presentation.debug.invincible);
    game.skipCinematic = !!(FD.cfg.presentation && FD.cfg.presentation.debug.skipCinematic);
    return game;
  };

  FD.boot = async function (opts = {}) {
    const canvas = opts.canvas || document.getElementById('screen');
    const game = FD.createGame(canvas);
    const loading = document.getElementById('loading');
    const progress = document.getElementById('loading-bar');
    try {
      await FD.assets.load((n, total) => {
        if (progress) progress.style.width = `${Math.round((n / total) * 100)}%`;
      });
    } catch (err) {
      if (loading) loading.textContent = 'ASSET ERROR: ' + err.message;
      throw err;
    }
    FD.font.atlas('white');
    FD.audio.restoreMuted();
    if (loading) loading.classList.add('hidden');
    const startState = FD.cfg.presentation.debug.startAt || 'title';
    game.startTitle();
    if (startState === 'stage') game.startStage();
    if (startState === 'cinematic' && FD.Cinematic) game.setState('cinematic');
    const firstGesture = () => {
      FD.audio.unlock();
      window.removeEventListener('pointerdown', firstGesture);
      window.removeEventListener('keydown', firstGesture);
    };
    window.addEventListener('pointerdown', firstGesture);
    window.addEventListener('keydown', firstGesture);
    if (opts.autostart !== false) game.startLoop();
    FD.game = game;
    return game;
  };
})();

</script>
<script>
  // Optional captured cinematic bundle (produced by tools/capture/export_film.js).
  (function () {
    const params = new URLSearchParams(location.search);
    if (params.get('capture') === '1') {
      window.FD_CAPTURE = true;
    }
    if (window.FD_CINEMATIC_SRC) {
      const s = document.createElement('script');
      s.src = window.FD_CINEMATIC_SRC;
      document.body.appendChild(s);
    }
  })();
  window.addEventListener('load', async () => {
    try {
      const game = await FD.boot({});
      FD.input.bindTouch(document.getElementById('touch'));
      document.getElementById('screen').focus();
      if (window.FD_CAPTURE) {
        // capture harness: jump straight into the demo run
        game.skipCinematic = true;
        game.autopilot = true;
        game.startStage();
        game.setState('intro');
      }
    } catch (err) {
      document.getElementById('loading').textContent = 'ERROR: ' + err.message;
      console.error(err);
    }
  });
</script>
</body>
